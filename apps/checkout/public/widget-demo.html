<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tixkit Widget Demo</title>
    <style>
      body {
        margin: 0;
        font:
          15px/1.55 ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #f6f7f9;
        color: #171717;
      }
      .wrap {
        max-width: 960px;
        margin: 0 auto;
        padding: 32px 20px 64px;
      }
      h1 {
        font-size: 1.6rem;
        margin: 0 0 8px;
      }
      p.lede {
        color: #555;
        margin: 0 0 28px;
      }
      .demo {
        background: #fff;
        border: 1px solid rgba(23, 23, 23, 0.12);
        border-radius: 12px;
        padding: 24px;
        margin-bottom: 24px;
      }
      .demo h2 {
        font-size: 1.05rem;
        margin: 0 0 16px;
      }
      .events {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 16px;
      }
      .events button {
        background: #171717;
        color: #fff;
        border: 0;
        border-radius: 8px;
        padding: 10px 16px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      #log {
        white-space: pre-wrap;
        font:
          12px/1.5 ui-monospace,
          SFMono-Regular,
          Consolas,
          monospace;
        background: #0b1020;
        color: #cdd6f4;
        padding: 12px 14px;
        border-radius: 8px;
        max-height: 220px;
        overflow: auto;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Tixkit Widget Demo</h1>
      <p class="lede">
        Embedded widget and buy-button with lifecycle events. Point the widgets at a real event by
        editing the <code>event</code> attribute.
      </p>

      <section class="demo">
        <h2>Inline widget</h2>
        <!--
          In production, load the bundled widget from your CDN:
          <script src="https://cdn.tixkit.com/widget/tixkit-widget.js"></script>
          For this demo we load the local build.
        -->
        <tixkit-widget
          id="inline-widget"
          brand="brand_demo"
          event="evt_demo"
          checkout-mode="inline"
          api-base-url="http://localhost:3000"
        ></tixkit-widget>
      </section>

      <section class="demo">
        <h2>Buy buttons (modal / redirect)</h2>
        <div class="events">
          <tixkit-button
            event="evt_demo"
            brand="brand_demo"
            items="tt_demo=2"
            checkout-mode="modal"
            api-base-url="http://localhost:3000"
          >
            Buy 2 tickets (modal)
          </tixkit-button>

          <tixkit-button
            event="evt_demo"
            brand="brand_demo"
            items="tt_demo=1"
            checkout-mode="redirect"
            api-base-url="http://localhost:3000"
          >
            Buy 1 ticket (redirect)
          </tixkit-button>
        </div>
      </section>

      <section class="demo">
        <h2>Lifecycle events</h2>
        <div id="log">(no events yet)</div>
      </section>
    </div>

    <script type="module" src="/tixkit-widget.js"></script>
    <script type="module">
      const log = document.getElementById('log');
      const record = (target, name) => {
        const line = `[${new Date().toLocaleTimeString()}] ${target} → ${name}`;
        log.textContent =
          (log.textContent === '(no events yet)' ? '' : log.textContent + '\n') + line;
        console.log(line);
      };

      const widget = document.getElementById('inline-widget');
      [
        'loaded',
        'loading',
        'error',
        'opened',
        'closed',
        'checkout_started',
        'order_completed',
      ].forEach((ev) => widget.addEventListener(ev, (e) => record('widget', ev)));

      document.querySelectorAll('tixkit-button').forEach((btn) => {
        ['loaded', 'opened', 'closed', 'checkout_started', 'error'].forEach((ev) =>
          btn.addEventListener(ev, () => record('button', ev)),
        );
      });
    </script>
  </body>
</html>
