name: tixkit_flutter_demo
description: Demo app for the Tixkit Flutter SDK — scanner, ticket display, checkout handoff, and offline manifest sync.
publish_to: none
version: 0.1.0

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  tixkit_flutter:
    path: ../../packages/sdk-flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^4.0.0

flutter:
  uses-material-design: true
