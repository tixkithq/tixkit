                      - events.execute
                      - readiness.read
                maximumAutonomy:
                  type: string
                  enum:
                    - read
                    - recommend
                    - prepare
                    - execute_with_approval
              required:
                - id
                - kind
                - capabilities
                - maximumAutonomy
            example:
