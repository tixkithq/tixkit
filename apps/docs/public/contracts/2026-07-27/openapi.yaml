  /checkout/sessions:
    post:
      summary: Create checkout session (public, Idempotency-Key required)
      parameters:
        - $ref: "#/components/parameters/RequiredIdempotencyKey"
        - name: X-Tixkit-Test-Order
          in: header
          required: false
          schema:
            type: string
            enum:
              - "1"
          description: Authenticated events.write users may set this only in capture/mock or explicit provider-test mode. Draft checkout is allowed, no provider charge is created, and the resulting order is tagged as test.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eventId:
                  type: string
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    properties:
                      ticketTypeId:
                        type: string
                      occurrenceId:
                        type: string
                      productId:
                        type: string
                      resaleListingId:
                        type: string
                      quantity:
                        type: integer
                        minimum: 1
                      unitAmountCents:
                        type: integer
                      attendeeFields:
                        type: array
                        items:
                          type: object
                          properties:
                            dateOfBirth:
                              type: string
                              pattern: ^\d{4}-\d{2}-\d{2}$
                              description: Required only when the event has a positive minimum age.
                          additionalProperties: true
                    oneOf:
                      - required:
                          - ticketTypeId
                          - quantity
                        not:
                          anyOf:
                            - required:
                                - productId
                            - required:
                                - resaleListingId
                      - required:
                          - productId
                          - quantity
                        not:
                          anyOf:
                            - required:
                                - ticketTypeId
                            - required:
                                - resaleListingId
                      - required:
                          - resaleListingId
                          - quantity
                        properties:
                          quantity:
                            const: 1
                        not:
                          anyOf:
                            - required:
                                - ticketTypeId
                            - required:
                                - productId
                            - required:
                                - occurrenceId
                            - required:
                                - unitAmountCents
                            - required:
                                - attendeeFields
                discountCode:
                  type: string
                affiliateCode:
                  type: string
                trackingId:
                  type: string
                accessCode:
                  type: string
                waitlistClaimToken:
                  type: string
                buyer:
                  type: object
                  properties:
                    email:
                      type: string
                      format: email
                    firstName:
                      type: string
                    lastName:
                      type: string
                    phone:
                      type: string
                    dateOfBirth:
                      type: string
                      pattern: ^\d{4}-\d{2}-\d{2}$
                      description: Required only when the event has a positive minimum age.
                  required:
                    - email
                buyerFields:
                  type: object
                  additionalProperties: true
                successUrl:
                  type: string
                  format: uri
                cancelUrl:
                  type: string
                  format: uri
              required:
                - eventId
                - items
                - buyer
            example:
              eventId: event_example
              items:
                - ticketTypeId: tickettype_example
                  quantity: 1
              buyer:
                email: operator@example.test
      responses:
        "201":
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSession"
              example:
                id: resource_example
                eventId: event_example
