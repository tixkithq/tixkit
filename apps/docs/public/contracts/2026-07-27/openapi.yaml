            readinessSnapshotSha256:
              type: string
              pattern: ^[a-f0-9]{64}$
          required:
            - readinessSnapshotSha256
        idempotencyKey:
          type: string
          minLength: 16
          maxLength: 127
        expectedPolicyVersion:
          type: integer
          minimum: 1
        preparedAt:
          type: string
          format: date-time
      required:
        - id
        - protocolVersion
        - agentPrincipalId
        - sponsorPrincipalId
        - delegationGrantId
        - kind
        - autonomy
        - target
        - payload
        - idempotencyKey
        - expectedPolicyVersion
        - preparedAt
    PreparedAgentAction:
      type: object
      description: Immutable typed action plus server-authoritative dry-run evidence. eligibleForApproval does not grant execution authority; fresh human approval remains mandatory.
      additionalProperties: false
      properties:
        action:
          $ref: "#/components/schemas/AgentAction"
        actionDigest:
          type: string
          pattern: ^[a-f0-9]{64}$
        expiresAt:
          type: string
          format: date-time
        authorization:
          type: object
          additionalProperties: false
          properties:
            eligibleForApproval:
              type: boolean
            reasons:
              type: array
              items:
                type: string
              uniqueItems: true
            snapshotSha256:
              type: string
              pattern: ^[a-f0-9]{64}$
            checkedAt:
              type: string
              format: date-time
          required:
            - eligibleForApproval
            - reasons
            - snapshotSha256
            - checkedAt
        dryRun:
          type: object
          additionalProperties: false
          properties:
            launchable:
              type: boolean
            readinessSnapshotSha256:
              type: string
              pattern: ^[a-f0-9]{64}$
            blockingReasonCodes:
              type: array
              items:
                type: string
              uniqueItems: true
          required:
            - launchable
            - readinessSnapshotSha256
            - blockingReasonCodes
      required:
        - action
        - actionDigest
        - expiresAt
        - authorization
        - dryRun
    AgentApproval:
      type: object
      description: Fresh human approval bound to one immutable action digest and current server-derived permission/policy evidence. Approval does not itself execute the action.
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: ^apr_[a-f0-9]{48}$
        tenantId:
          type: string
        actionDigest:
          type: string
          pattern: ^[a-f0-9]{64}$
        planSha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        approverPrincipalId:
          type: string
        approverPermissionSnapshot:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            const: events:publish
        policyVersion:
          type: integer
          minimum: 1
        approvedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        consumedAt:
          type: string
          format: date-time
      required:
        - id
        - tenantId
        - actionDigest
        - approverPrincipalId
        - approverPermissionSnapshot
        - policyVersion
        - approvedAt
        - expiresAt
    AgentExecution:
      type: object
      description: Durable, tenant-scoped execution evidence for one approved immutable action. Reserved evidence has no lease or terminal payload; running evidence has a valid lease; succeeded evidence has one exact published result; failed evidence has one bounded failure code; compensated evidence has no result and uses AGENT_ACTION_COMPENSATED. Terminal exact replays do not repeat the product effect.
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: ^exec_[a-f0-9]{48}$
          example: exec_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        tenantId:
          type: string
        actionId:
          type: string
          pattern: ^act_[a-f0-9]{48}$
          example: act_bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        actionDigest:
          type: string
          pattern: ^[a-f0-9]{64}$
          example: cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
        agentPrincipalId:
          type: string
          pattern: ^agt_[a-f0-9]{48}$
          example: agt_dddddddddddddddddddddddddddddddddddddddddddddddd
        sponsorPrincipalId:
          type: string
        delegationGrantId:
          type: string
          pattern: ^dlg_[a-f0-9]{48}$
          example: dlg_eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
        approvalId:
          type: string
          pattern: ^apr_[a-f0-9]{48}$
          example: apr_ffffffffffffffffffffffffffffffffffffffffffffffff
        idempotencyKey:
          type: string
          pattern: ^[a-f0-9]{64}$
          example: "1111111111111111111111111111111111111111111111111111111111111111"
        requestFingerprint:
          type: string
          pattern: ^[a-f0-9]{64}$
          example: "2222222222222222222222222222222222222222222222222222222222222222"
        state:
          type: string
          enum:
            - reserved
            - running
            - succeeded
            - failed
            - compensated
        resourceVersion:
          type: integer
          minimum: 0
        policyVersion:
          type: integer
          minimum: 1
        fenceToken:
          type: integer
          minimum: 0
        leaseOwner:
          type: string
        leaseExpiresAt:
          type: string
          format: date-time
        result:
          type: object
          additionalProperties: false
          properties:
            resourceId:
              type: string
            resourceVersion:
              type: integer
              minimum: 0
            status:
              type: string
              const: published
          required:
            - resourceId
            - resourceVersion
            - status
        failureCode:
          type: string
          pattern: ^[A-Z0-9_]{3,64}$
          description: Required for failed evidence. Compensated evidence uses AGENT_ACTION_COMPENSATED exactly.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - tenantId
        - actionId
        - actionDigest
        - agentPrincipalId
        - sponsorPrincipalId
        - delegationGrantId
        - approvalId
        - idempotencyKey
        - requestFingerprint
        - state
        - resourceVersion
        - policyVersion
        - fenceToken
        - createdAt
        - updatedAt
    AgentExecutionAuditRecord:
      type: object
      description: Immutable, ordered lifecycle evidence bound to the exact execution identity, action digest, approval, idempotency key and resource version.
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: ^aaud_[a-f0-9]{48}$
          example: aaud_aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        tenantId:
          type: string
        agentPrincipalId:
          type: string
          pattern: ^agt_[a-f0-9]{48}$
          example: agt_bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        sponsorPrincipalId:
          type: string
        delegationGrantId:
          type: string
          pattern: ^dlg_[a-f0-9]{48}$
          example: dlg_cccccccccccccccccccccccccccccccccccccccccccccccc
        actionId:
          type: string
          pattern: ^act_[a-f0-9]{48}$
          example: act_dddddddddddddddddddddddddddddddddddddddddddddddd
        actionDigest:
          type: string
          pattern: ^[a-f0-9]{64}$
          example: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
        planSha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        approvalId:
          type: string
          pattern: ^apr_[a-f0-9]{48}$
          example: apr_ffffffffffffffffffffffffffffffffffffffffffffffff
        phase:
          type: string
          enum:
            - prepared
            - authorized
            - denied
            - started
            - succeeded
            - failed
            - compensated
        idempotencyKey:
          type: string
          pattern: ^[a-f0-9]{64}$
          example: "1111111111111111111111111111111111111111111111111111111111111111"
        resourceVersion:
          type: integer
          minimum: 0
        occurredAt:
          type: string
          format: date-time
        reasonCodes:
          type: array
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            pattern: ^[a-z0-9_]{2,64}$
      required:
        - id
        - tenantId
        - agentPrincipalId
        - sponsorPrincipalId
        - delegationGrantId
        - actionId
        - actionDigest
        - approvalId
        - phase
        - idempotencyKey
        - resourceVersion
        - occurredAt
        - reasonCodes
    AgentExecutionEvidence:
      type: object
      description: Durable execution plus bounded immutable audit history, visible only to the exact agent principal or human sponsor.
      additionalProperties: false
      properties:
        execution:
          $ref: "#/components/schemas/AgentExecution"
        audit:
          type: array
          minItems: 2
          maxItems: 100
          items:
            $ref: "#/components/schemas/AgentExecutionAuditRecord"
      required:
        - execution
        - audit
    AgentDelegation:
      type: object
      description: Time-bounded authority grant. The server derives the sponsor, issue time, and permission snapshot from live authorization state.
      properties:
        id:
          type: string
          pattern: ^dlg_[a-f0-9]{48}$
        tenantId:
          type: string
        agentPrincipalId:
          type: string
          pattern: ^agt_[a-f0-9]{48}$
        sponsorPrincipalId:
          type: string
        capabilities:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            enum:
              - events.read
              - events.prepare
              - events.execute
              - readiness.read
        resourceScopes:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            pattern: ^event:[A-Za-z0-9][A-Za-z0-9_-]{1,62}$
        permissionSnapshot:
          type: array
          items:
            type: string
          uniqueItems: true
        issuedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
      required:
        - id
        - tenantId
        - agentPrincipalId
        - sponsorPrincipalId
        - capabilities
        - resourceScopes
        - permissionSnapshot
        - issuedAt
        - expiresAt
      additionalProperties: false
    AgentMemoryNamespaceRequest:
      oneOf:
        - type: object
          additionalProperties: false
          properties:
            scopeType:
              type: string
              const: workspace
            purpose:
              type: string
              enum:
                - organizer_preferences
                - project_context
          required:
            - scopeType
            - purpose
        - type: object
          additionalProperties: false
          properties:
            scopeType:
              type: string
              const: event
            scopeId:
              type: string
              pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{1,62}$
            purpose:
              type: string
              enum:
                - organizer_preferences
                - project_context
          required:
            - scopeType
            - scopeId
            - purpose
      discriminator:
        propertyName: scopeType
    AgentMemoryNamespace:
      type: object
      additionalProperties: false
      properties:
        tenantId:
          type: string
        sponsorPrincipalId:
          type: string
        scopeType:
          type: string
          enum:
            - workspace
            - event
        scopeId:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9_-]{1,62}$
        purpose:
          type: string
          enum:
            - organizer_preferences
            - project_context
      required:
        - tenantId
        - sponsorPrincipalId
        - scopeType
        - purpose
    AgentMemoryOrganizerPreferences:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          const: organizer_preferences
        summary:
          type: string
          minLength: 1
          maxLength: 2000
        tone:
          type: string
          enum:
            - concise
            - warm
            - formal
            - direct
        verbosity:
          type: string
          enum:
            - brief
            - standard
            - detailed
        locale:
          type: string
        timezone:
          type: string
        currency:
          type: string
      required:
        - kind
        - summary
    AgentMemoryProjectContext:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          const: project_context
        summary:
          type: string
          minLength: 1
          maxLength: 2000
        facts:
          type: array
          maxItems: 25
          items:
            type: object
            additionalProperties: false
            properties:
              kind:
                type: string
                enum:
                  - objective
                  - constraint
                  - decision
              text:
                type: string
                minLength: 1
                maxLength: 2000
            required:
              - kind
              - text
      required:
        - kind
        - summary
    AgentMemoryContent:
      oneOf:
        - $ref: "#/components/schemas/AgentMemoryOrganizerPreferences"
        - $ref: "#/components/schemas/AgentMemoryProjectContext"
      discriminator:
        propertyName: kind
    AgentMemoryProvenance:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
            - organizer
            - agent_observation
            - import
        actorPrincipalId:
          type: string
        agentPrincipalId:
          type: string
        sourceReference:
          type: string
        observedAt:
          type: string
          format: date-time
      required:
        - type
        - actorPrincipalId
        - observedAt
    AgentMemoryCreateRequest:
      oneOf:
        - type: object
          additionalProperties: false
          properties:
            namespace:
              allOf:
                - $ref: "#/components/schemas/AgentMemoryNamespaceRequest"
                - type: object
                  properties:
                    purpose:
                      const: organizer_preferences
                  required:
                    - purpose
            key:
              type: string
              pattern: ^[a-z][a-z0-9_.-]{1,63}$
              example: copy_preferences
            content:
              $ref: "#/components/schemas/AgentMemoryOrganizerPreferences"
            retentionExpiresAt:
              type: string
              format: date-time
              example: 2026-08-20T12:00:00.000Z
          required:
            - namespace
            - key
            - content
            - retentionExpiresAt
        - type: object
          additionalProperties: false
          properties:
            namespace:
              allOf:
                - $ref: "#/components/schemas/AgentMemoryNamespaceRequest"
                - type: object
                  properties:
                    purpose:
                      const: project_context
                  required:
                    - purpose
            key:
              type: string
              pattern: ^[a-z][a-z0-9_.-]{1,63}$
              example: event_context
            content:
              $ref: "#/components/schemas/AgentMemoryProjectContext"
            retentionExpiresAt:
              type: string
              format: date-time
              example: 2026-08-20T12:00:00.000Z
          required:
            - namespace
            - key
            - content
            - retentionExpiresAt
    AgentMemoryNamespaceRequestBody:
      type: object
      additionalProperties: false
      properties:
        namespace:
          $ref: "#/components/schemas/AgentMemoryNamespaceRequest"
      required:
        - namespace
    AgentMemoryCorrectRequest:
      type: object
      additionalProperties: false
      properties:
        expectedVersion:
          type: integer
          minimum: 1
        content:
          $ref: "#/components/schemas/AgentMemoryContent"
        retentionExpiresAt:
          type: string
          format: date-time
          example: 2026-08-20T12:00:00.000Z
          description: Must remain within the shared maximum retention window.
      required:
        - expectedVersion
        - content
        - retentionExpiresAt
    AgentMemoryDeleteRequest:
      type: object
      additionalProperties: false
      properties:
        namespace:
          $ref: "#/components/schemas/AgentMemoryNamespaceRequest"
        expectedVersion:
          type: integer
          minimum: 1
      required:
        - namespace
        - expectedVersion
    AgentMemoryEntry:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          pattern: ^mem_[A-Za-z0-9_-]+$
        namespace:
          $ref: "#/components/schemas/AgentMemoryNamespace"
        key:
          type: string
          pattern: ^[a-z][a-z0-9_.-]{1,63}$
        content:
          $ref: "#/components/schemas/AgentMemoryContent"
        contentSha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        provenance:
          $ref: "#/components/schemas/AgentMemoryProvenance"
        version:
          type: integer
          minimum: 1
        retentionExpiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - namespace
        - key
        - content
        - contentSha256
        - provenance
        - version
        - retentionExpiresAt
        - createdAt
        - updatedAt
    AgentMemoryExportBundle:
      type: object
      additionalProperties: false
      properties:
        schemaVersion:
          type: integer
          const: 1
        exportedAt:
          type: string
          format: date-time
        namespace:
          $ref: "#/components/schemas/AgentMemoryNamespace"
        entries:
          type: array
          items:
            $ref: "#/components/schemas/AgentMemoryEntry"
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
      required:
        - schemaVersion
        - exportedAt
        - namespace
        - entries
        - sha256
    OAuthApplication:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        organizationId:
          type: string
        name:
          type: string
        clientId:
          type: string
        redirectUris:
          type: array
          items:
            type: string
        scopes:
          type: array
          items:
            type: string
        status:
          type: string
          enum:
            - active
            - disabled
            - revoked
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - organizationId
        - name
        - clientId
        - redirectUris
        - scopes
        - status
    OAuthApplicationCreated:
      type: object
      description: OAuth application with the client secret shown only at creation.
      allOf:
        - $ref: "#/components/schemas/OAuthApplication"
        - type: object
          properties:
            clientSecret:
              type: string
              description: Client secret. Store securely; never returned again.
          required:
            - clientSecret
    OAuthTokenResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum:
            - Bearer
        expires_in:
          type: integer
        scope:
          type: string
        refresh_token:
          type: string
      required:
        - access_token
        - token_type
        - expires_in
        - scope
paths:
  /health:
    servers:
      - url: https://api.tixkit.com
        description: Production operational root
      - url: http://localhost:4000
        description: Local operational root
    get:
      summary: Health check
      responses:
        "200":
          description: OK
      operationId: getHealth
      tags:
        - System
      security: []
  /bootstrap-context:
    get:
      summary: Get scoped admin bootstrap context
      description: Returns the organizations and brands visible to the current principal for dashboard scope selection. Principals with settings.write receive settings details; other dashboard operators receive minimal scoped identity only.
      security:
        - BearerAuth: []
        - ApiKey: []
      responses:
        "200":
          description: Scoped dashboard bootstrap context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BootstrapContext"
              example:
                organizations:
                  - id: resource_example
                    tenantId: tenant_example
                    name: name example
                    slug: slug example
                    status: status example
                brands:
                  - id: resource_example
                    tenantId: tenant_example
                    organizationId: organization_example
                    name: name example
                    slug: slug example
                    status: status example
                    theme: {}
                    domains:
                      - id: resource_example
                        brandId: brand_example
                        domain: domain example
                        isPrimary: true
                        isVerified: true
                        sslStatus: sslStatus example
                    whiteLabel: true
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: code example
                  message: message example
                  requestId: request_example
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: code example
                  message: message example
                  requestId: request_example
      operationId: getBootstrapContext
      tags:
        - Identity
  /organizations:
    get:
      summary: List organizations
      security:
        - BearerAuth: []
        - ApiKey: []
      x-required-permissions:
        - settings.write
      responses:
        "200":
          description: Organizations visible to the principal
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organization"
              example:
                - id: resource_example
                  tenantId: tenant_example
                  name: name example
                  slug: slug example
                  boxOfficeSettings:
                    enabled: true
                    allowedTenderTypes:
                      - cash
                    requireBuyerEmail: true
                    receiptMode: print
                  status: status example
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: code example
                  message: message example
                  requestId: request_example
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: code example
                  message: message example
                  requestId: request_example
      operationId: getOrganizations
      tags:
        - Organizations
    post:
      summary: Create organization
      security:
        - BearerAuth: []
        - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                slug:
                  type: string
                clerkOrganizationId:
                  type: string
                boxOfficeSettings:
                  $ref: "#/components/schemas/BoxOfficeSettings"
                eventDefaults:
                  $ref: "#/components/schemas/EventDefaults"
              required:
                - name
                - slug
            example:
              name: name example
              slug: slug example
      responses:
        "201":
          description: Organization created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
              example:
                id: resource_example
                tenantId: tenant_example
                name: name example
                slug: slug example
                boxOfficeSettings:
                  enabled: true
                  allowedTenderTypes:
                    - cash
                  requireBuyerEmail: true
                  receiptMode: print
                status: status example
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: code example
                  message: message example
                  requestId: request_example
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: code example
                  message: message example
                  requestId: request_example
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: code example
                  message: message example
                  requestId: request_example
        "409":
          description: Slug already in use
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                error:
                  code: code example
                  message: message example
                  requestId: request_example
      operationId: postOrganizations
      tags:
        - Organizations
  /brands:
    get:
      summary: List brands
      security:
        - BearerAuth: []
        - ApiKey: []
      x-required-permissions:
        - settings.write
      responses:
        "200":
          description: Brands visible to the principal
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Brand"
              example:
                - id: resource_example
                  tenantId: tenant_example
                  organizationId: organization_example
                  name: name example
                  slug: slug example
                  status: status example
      operationId: getBrands
      tags:
        - Brands
    post:
      summary: Create brand
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                organizationId:
                  type: string
                name:
                  type: string
                slug:
                  type: string
                theme:
                  type: object
                whiteLabel:
                  type: boolean
              required:
                - organizationId
                - name
                - slug
            example:
              organizationId: organization_example
              name: name example
              slug: slug example
      responses:
        "201":
          description: Brand created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brand"
              example:
                id: resource_example
                tenantId: tenant_example
                organizationId: organization_example
                name: name example
                slug: slug example
                status: status example
      operationId: postBrands
      tags:
