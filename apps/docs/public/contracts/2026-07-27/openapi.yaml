  /oauth/token:
    post:
      summary: Issue a resource-owner or explicit agent OAuth access token
      description: Resource-owner applications use authorization_code or refresh_token. Agent applications use client_credentials, receive a ten-minute tk_aat_ token with fixed agent.invoke scope, and never receive a refresh token. Clients may authenticate with client_secret_basic or JSON/form body fields, but must not mix methods. Credentials are never accepted in the query string.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  enum:
                    - authorization_code
                    - refresh_token
                    - client_credentials
                client_id:
                  type: string
                client_secret:
                  type: string
                  writeOnly: true
                code:
                  type: string
                redirect_uri:
                  type: string
                  format: uri
                refresh_token:
                  type: string
              required:
                - grant_type
            example:
              grant_type: authorization_code
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: false
              properties:
                grant_type:
                  type: string
                  enum:
                    - authorization_code
                    - refresh_token
                    - client_credentials
                client_id:
                  type: string
                client_secret:
                  type: string
                  writeOnly: true
                code:
                  type: string
                redirect_uri:
                  type: string
                  format: uri
                refresh_token:
                  type: string
                  writeOnly: true
              required:
                - grant_type
      responses:
        "200":
          description: OAuth token response
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthTokenResponse"
              example:
                access_token: $REDACTED_SECRET
                token_type: Bearer
                expires_in: 1
                scope: scope example
      operationId: postOauthToken
      tags:
        - OAuth
      security: []
  /oauth/revoke:
    post:
      summary: Revoke OAuth access or refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                client_secret:
                  type: string
                token:
                  type: string
              required:
                - client_id
                - client_secret
                - token
            example:
              client_id: client__example
              client_secret: $REDACTED_SECRET
              token: $REDACTED_SECRET
      responses:
        "200":
          description: Token revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked:
                    type: boolean
                required:
                  - revoked
              example:
