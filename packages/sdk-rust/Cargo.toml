[package]
name = "tixkit"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
description = "Async Rust SDK for the Tixkit API"
repository = "https://github.com/nkgotcode/tixkit"
homepage = "https://github.com/nkgotcode/tixkit"
documentation = "https://docs.rs/tixkit"
readme = "README.md"
keywords = ["tixkit", "ticketing", "sdk", "api", "webhooks"]
categories = ["api-bindings", "asynchronous", "web-programming::http-client"]
include = [
  "Cargo.toml",
  "README.md",
  "src/**/*.rs",
  "examples/**/*.rs",
]

[dependencies]
futures-util = "0.3.32"
hex = "0.4.3"
hmac = "0.13.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_urlencoded = "0.7.1"
sha2 = "0.11.0"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["macros", "rt-multi-thread", "time"] }

[dev-dependencies]
wiremock = "0.6.5"

[[example]]
name = "checkout"
path = "examples/checkout.rs"
