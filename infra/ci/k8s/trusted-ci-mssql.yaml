# Provision the tixkit-ci-mssql Secret separately before applying this manifest.
# Read the password from a root-readable file so it is not committed here,
# exposed in process arguments, or retained in shell history:
#   kubectl create secret generic tixkit-ci-mssql -n arc-runners \
#     --from-file=MSSQL_SA_PASSWORD=/run/secrets/tixkit-ci-mssql-sa-password \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tixkit-ci-mssql
  namespace: arc-runners
  labels:
    app.kubernetes.io/name: tixkit-ci-mssql
    app.kubernetes.io/part-of: tixkit-ci
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tixkit-ci-mssql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tixkit-ci-mssql
        app.kubernetes.io/part-of: tixkit-ci
    spec:
      nodeSelector:
        node-role.kubernetes.io/ci: 'true'
      tolerations:
        - key: dedicated
          operator: Equal
          value: ci
          effect: NoSchedule
      containers:
        - name: mssql
          image: mcr.microsoft.com/mssql/server:2022-latest@sha256:e07b9699a2b749969f19d86563ceeea22bd3a69f7f1db85a8d1ac4bdaf0c6f56
          imagePullPolicy: IfNotPresent
          ports:
            - name: tds
              containerPort: 1433
          env:
            - name: ACCEPT_EULA
              value: 'Y'
            - name: MSSQL_PID
              value: Developer
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: tixkit-ci-mssql
                  key: MSSQL_SA_PASSWORD
          resources:
            requests:
              cpu: '2'
              memory: 8Gi
            limits:
              cpu: '8'
              memory: 12Gi
          readinessProbe:
            tcpSocket:
              port: tds
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 18
          volumeMounts:
            - name: mssql-data
              mountPath: /var/opt/mssql
      volumes:
        - name: mssql-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tixkit-ci-mssql
  namespace: arc-runners
  labels:
    app.kubernetes.io/name: tixkit-ci-mssql
    app.kubernetes.io/part-of: tixkit-ci
spec:
  selector:
    app.kubernetes.io/name: tixkit-ci-mssql
  ports:
    - name: tds
      port: 1433
      targetPort: tds
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: arc-runners-egress-mssql
  namespace: arc-runners
  labels:
    app.kubernetes.io/name: tixkit-ci-mssql
    app.kubernetes.io/part-of: tixkit-ci
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: runner
      app.kubernetes.io/part-of: gha-runner-scale-set
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tixkit-ci-mssql
      ports:
        - protocol: TCP
          port: 1433
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tixkit-ci-mssql-ingress
  namespace: arc-runners
  labels:
    app.kubernetes.io/name: tixkit-ci-mssql
    app.kubernetes.io/part-of: tixkit-ci
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tixkit-ci-mssql
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: runner
              app.kubernetes.io/part-of: gha-runner-scale-set
      ports:
        - protocol: TCP
          port: 1433
