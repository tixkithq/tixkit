githubConfigUrl: https://github.com/nkgotcode/tixkit
runnerScaleSetName: tixkit-epyc-trusted
runnerGroup: Default

# Create the secret separately. GitHub App auth is preferred:
# kubectl create secret generic arc-github-auth \
#   -n arc-runners \
#   --from-literal=github_app_id='<app_id>' \
#   --from-literal=github_app_installation_id='<installation_id>' \
#   --from-file=github_app_private_key=/path/to/private-key.pem
githubConfigSecret: arc-github-auth

maxRunners: 12
minRunners: 0

scaleSetLabels:
  - self-hosted
  - tixkit
  - trusted
  - linux
  - epyc

# Keep dind explicit instead of using containerMode.type=dind so dockerd can be
# forced away from overlayfs. Kata-backed runner pods reject overlay mounts when
# GitHub service containers are created.
containerMode: {}

template:
  spec:
    runtimeClassName: kata
    restartPolicy: Never
    nodeSelector:
      node-role.kubernetes.io/ci: 'true'
    tolerations:
      - key: dedicated
        operator: Equal
        value: ci
        effect: NoSchedule
    securityContext:
      seccompProfile:
        type: RuntimeDefault
    initContainers:
      - name: init-dind-externals
        image: localhost:5000/tixkit-arc-runner:2.335.1-flutter@sha256:e49f5d30ab66a2d25c963def78d3dd75982c8978ab23acbb4757e43aa2bec1e9
        command:
          - cp
          - -r
          - /home/runner/externals/.
          - /home/runner/tmpDir/
        volumeMounts:
          - name: dind-externals
            mountPath: /home/runner/tmpDir
      - name: dind
        image: docker:29.6.1-dind@sha256:66d292e5c26bd33a6f6f61cacb880de2186339a524ecba1ce098dbbaceed6515
        restartPolicy: Always
        args:
          - dockerd
          - --host=unix:///var/run/docker.sock
          - --group=$(DOCKER_GROUP_GID)
          - --storage-driver=vfs
          - --feature
          - containerd-snapshotter=false
        env:
          - name: DOCKER_GROUP_GID
            value: '123'
        securityContext:
          privileged: true
        startupProbe:
          exec:
            command:
              - docker
              - info
          initialDelaySeconds: 0
          failureThreshold: 24
          periodSeconds: 5
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
          - name: dind-externals
            mountPath: /home/runner/externals
    containers:
      - name: runner
        image: localhost:5000/tixkit-arc-runner:2.335.1-flutter@sha256:e49f5d30ab66a2d25c963def78d3dd75982c8978ab23acbb4757e43aa2bec1e9
        command:
          - /home/runner/run.sh
        env:
          - name: DOCKER_HOST
            value: unix:///var/run/docker.sock
          - name: RUNNER_WAIT_FOR_DOCKER_IN_SECONDS
            value: '120'
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          readOnlyRootFilesystem: false
        volumeMounts:
          - name: work
            mountPath: /home/runner/_work
          - name: dind-sock
            mountPath: /var/run
        resources:
          requests:
            cpu: '4'
            memory: 8Gi
          limits:
            cpu: '16'
            memory: 24Gi
    volumes:
      - name: work
        emptyDir: {}
      - name: dind-sock
        emptyDir: {}
      - name: dind-externals
        emptyDir: {}

listenerTemplate:
  spec:
    nodeSelector:
      node-role.kubernetes.io/ci: 'true'
    tolerations:
      - key: dedicated
        operator: Equal
        value: ci
        effect: NoSchedule
    containers:
      - name: listener
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi

controllerServiceAccount:
  namespace: arc-systems
  name: arc-gha-rs-controller
