services:
  - type: keyvalue
    name: tixkit-redis
    plan: starter
    ipAllowList: []

  - type: web
    name: tixkit-api
    env: docker
    dockerfilePath: ./Dockerfile.api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: tixkit-redis
          property: connectionString
      - key: PORT
        value: 4000
      - key: TRUST_PROXY
        value: 1
      - key: CORS_ALLOWED_ORIGINS
        value: https://tixkit-checkout.onrender.com,https://tixkit-admin.onrender.com
      - key: CUSTOM_DOMAIN_CORS_ENABLED
        value: true
      - key: AUTH_PROVIDER
        value: clerk
      - key: API_BASE_URL
        value: https://tixkit-api.onrender.com
      - key: METRICS_BEARER_TOKEN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        sync: false
      - fromGroup: tixkit-public-storage
      - key: CLERK_SECRET_KEY
        sync: false
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_WEBHOOK_SECRET
        sync: false
      - key: TEMPORAL_ADDRESS
        sync: false
      - key: TEMPORAL_NAMESPACE
        sync: false
      - key: TEMPORAL_TASK_QUEUE
        value: tixkit-production
    plan: starter

  - type: worker
    name: tixkit-worker
    env: docker
    dockerfilePath: ./Dockerfile.worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: tixkit-redis
          property: connectionString
      - key: TEMPORAL_ADDRESS
        sync: false
      - key: TEMPORAL_NAMESPACE
        sync: false
      - key: TEMPORAL_TASK_QUEUE
        value: tixkit-production
    plan: starter

  - type: web
    name: tixkit-checkout
    env: docker
    dockerfilePath: ./Dockerfile.checkout
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: NEXT_PUBLIC_TIXKIT_API_BASE_URL
        value: https://tixkit-api.onrender.com/v1
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
    plan: starter

  - type: web
    name: tixkit-admin
    env: docker
    dockerfilePath: ./Dockerfile.admin
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: TIXKIT_DEPLOYMENT_PROFILE
        value: production
      - key: API_BASE_URL
        value: https://tixkit-api.onrender.com
      - key: TIXKIT_CHECKOUT_URL
        value: https://tixkit-checkout.onrender.com
      - key: TIXKIT_DOCS_URL
        value: https://docs.tixkit.com
      - key: AUTH_PROVIDER
        value: clerk
      - key: ALLOW_INSECURE_LOCAL_ORIGINS
        value: 0
      - key: CLERK_PUBLISHABLE_KEY
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - fromGroup: tixkit-public-storage
      # Set to the exact deployed Git commit or immutable release tag.
      - key: TIXKIT_BUILD_REVISION
        sync: false
    plan: starter

envVarGroups:
  # Before deployment, add one exact HTTPS S3_PUBLIC_ENDPOINT value to this
  # group in the Render Dashboard. Blueprint groups cannot use sync: false.
  - name: tixkit-public-storage
    envVars: []

databases:
  - name: postgres
    plan: starter
