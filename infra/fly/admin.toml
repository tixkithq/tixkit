app = "tixkit-admin"
primary_region = "iad"

[build]
dockerfile = "Dockerfile.admin"

[build.args]
NEXT_PUBLIC_ADMIN_API_BASE_URL = "https://api.example.com"
NEXT_PUBLIC_API_BASE_URL = "https://api.example.com/v1"

[http_service]
internal_port = 3001
force_https = true
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1

[env]
NODE_ENV = "production"
PORT = "3001"
NEXT_PUBLIC_ADMIN_API_BASE_URL = "https://api.example.com"
NEXT_PUBLIC_API_BASE_URL = "https://api.example.com/v1"
