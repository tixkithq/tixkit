app = "tixkit-admin"
primary_region = "iad"

[build]
dockerfile = "Dockerfile.admin"

# Required runtime values before deployment. Fly secrets keep operator-specific
# values out of this public template:
# TIXKIT_BUILD_REVISION must be the selected admin image's source commit or release tag.
# fly secrets set CLERK_PUBLISHABLE_KEY="$CLERK_PUBLISHABLE_KEY" CLERK_SECRET_KEY="$CLERK_SECRET_KEY" S3_PUBLIC_ENDPOINT="$S3_PUBLIC_ENDPOINT" TIXKIT_BUILD_REVISION="$TIXKIT_BUILD_REVISION"

[http_service]
internal_port = 3001
force_https = true
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1

[[http_service.checks]]
grace_period = "10s"
interval = "15s"
method = "GET"
timeout = "2s"
path = "/ready"

[env]
NODE_ENV = "production"
PORT = "3001"
TIXKIT_DEPLOYMENT_PROFILE = "production"
API_BASE_URL = "https://tixkit-api.fly.dev"
TIXKIT_CHECKOUT_URL = "https://tixkit-checkout.fly.dev"
TIXKIT_DOCS_URL = "https://docs.tixkit.com"
AUTH_PROVIDER = "clerk"
ALLOW_INSECURE_LOCAL_ORIGINS = "0"
