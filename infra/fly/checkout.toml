app = "tixkit-checkout"
primary_region = "iad"

[build]
dockerfile = "Dockerfile.checkout"

# Required runtime secrets before deployment. The revision must identify the
# selected immutable checkout image, and the publishable key is safe to expose
# only through the validated browser snapshot:
# fly secrets set STRIPE_PUBLISHABLE_KEY="$STRIPE_PUBLISHABLE_KEY" S3_PUBLIC_ENDPOINT="$S3_PUBLIC_ENDPOINT" TIXKIT_BUILD_REVISION="$TIXKIT_BUILD_REVISION"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1

[env]
NODE_ENV = "production"
PORT = "3000"
TIXKIT_DEPLOYMENT_PROFILE = "production"
API_BASE_URL = "https://tixkit-api.fly.dev"
TIXKIT_CHECKOUT_URL = "https://tixkit-checkout.fly.dev"
ALLOW_INSECURE_LOCAL_ORIGINS = "0"

[[http_service.checks]]
method = "GET"
path = "/ready"
interval = "10s"
timeout = "2s"
