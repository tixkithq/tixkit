app = "tixkit-checkout"
primary_region = "iad"

[build]
dockerfile = "Dockerfile.checkout"

[build.args]
NEXT_PUBLIC_TIXKIT_API_BASE_URL = "https://tixkit-api.fly.dev/v1"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1

[env]
NODE_ENV = "production"
PORT = "3000"
NEXT_PUBLIC_TIXKIT_API_BASE_URL = "https://tixkit-api.fly.dev/v1"
