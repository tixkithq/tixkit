app = "tixkit-api"
primary_region = "iad"

[build]
dockerfile = "Dockerfile.api"

[http_service]
internal_port = 4000
force_https = true
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1

[env]
NODE_ENV = "production"
PORT = "4000"
TRUST_PROXY = "1"
CORS_ALLOWED_ORIGINS = "https://checkout.example.com,https://admin.example.com"
