app = "tixkit-api"
primary_region = "iad"

[build]
dockerfile = "Dockerfile.api"

# Use the same shell value as infra/fly/admin.toml so presigned upload URLs and
# the browser upload origin cannot drift between the API and admin services.
# fly secrets set S3_PUBLIC_ENDPOINT="$S3_PUBLIC_ENDPOINT"

[http_service]
internal_port = 4000
force_https = true
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1

[env]
NODE_ENV = "production"
PORT = "4000"
TRUST_PROXY = "1"
CORS_ALLOWED_ORIGINS = "https://tixkit-checkout.fly.dev,https://tixkit-admin.fly.dev"
CUSTOM_DOMAIN_CORS_ENABLED = "true"
