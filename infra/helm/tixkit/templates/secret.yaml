{{- if eq .Values.secrets.mode "create" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "tixkit.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  DATABASE_URL_MYSQL: {{ .Values.secrets.databaseUrlMysql | quote }}
  REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  TEMPORAL_ADDRESS: {{ .Values.secrets.temporalAddress | quote }}
  TEMPORAL_API_KEY: {{ .Values.secrets.temporalApiKey | quote }}
  TEMPORAL_TLS_CA: {{ .Values.secrets.temporalTlsCa | quote }}
  TEMPORAL_TLS_CERT: {{ .Values.secrets.temporalTlsCert | quote }}
  TEMPORAL_TLS_KEY: {{ .Values.secrets.temporalTlsKey | quote }}
  CLERK_SECRET_KEY: {{ .Values.secrets.clerkSecretKey | quote }}
  CLERK_PUBLISHABLE_KEY: {{ .Values.secrets.clerkPublishableKey | quote }}
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: {{ .Values.secrets.clerkPublishableKey | quote }}
  CLERK_WEBHOOK_SECRET: {{ .Values.secrets.clerkWebhookSecret | quote }}
  OIDC_ISSUER_URL: {{ .Values.secrets.oidcIssuerUrl | quote }}
  OIDC_AUDIENCE: {{ .Values.secrets.oidcAudience | quote }}
  STRIPE_SECRET_KEY: {{ .Values.secrets.stripeSecretKey | quote }}
  STRIPE_WEBHOOK_SECRET: {{ .Values.secrets.stripeWebhookSecret | quote }}
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: {{ .Values.secrets.stripePublishableKey | quote }}
  STRIPE_CONNECT_CLIENT_ID: {{ .Values.secrets.stripeConnectClientId | quote }}
  TELNYX_API_KEY: {{ .Values.secrets.telnyxApiKey | quote }}
  TELNYX_WEBHOOK_PUBLIC_KEY: {{ .Values.secrets.telnyxWebhookPublicKey | quote }}
  QR_SIGNING_SECRET: {{ .Values.secrets.qrSigningSecret | quote }}
  OFFLINE_MANIFEST_SIGNING_KEY: {{ .Values.secrets.offlineManifestSigningKey | quote }}
  S3_ENDPOINT: {{ .Values.secrets.s3Endpoint | quote }}
  S3_ACCESS_KEY_ID: {{ .Values.secrets.s3AccessKeyId | quote }}
  S3_SECRET_ACCESS_KEY: {{ .Values.secrets.s3SecretAccessKey | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.secrets.otelExporterOtlpEndpoint | quote }}
  OTEL_EXPORTER_OTLP_HEADERS: {{ .Values.secrets.otelExporterOtlpHeaders | quote }}
  PROMETHEUS_PUSHGATEWAY_URL: {{ .Values.secrets.prometheusPushgatewayUrl | quote }}
  METRICS_BEARER_TOKEN: {{ .Values.secrets.metricsBearerToken | quote }}
  DASHBOARD_CURSOR_SIGNING_KEY: {{ .Values.secrets.dashboardCursorSigningKey | quote }}
{{- end }}
