apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tixkit.fullname" . }}-checkout
  labels:
    {{- include "tixkit.labels" . | nindent 4 }}
    app.kubernetes.io/component: checkout
spec:
  replicas: {{ .Values.checkout.replicas }}
  selector:
    matchLabels:
      {{- include "tixkit.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: checkout
  template:
    metadata:
      labels:
        {{- include "tixkit.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: checkout
    spec:
      containers:
        - name: checkout
          image: {{ include "tixkit.image" (dict "Values" .Values "image" .Values.checkout.image "digest" .Values.checkout.imageDigest) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.checkout.port }}
          envFrom:
            - configMapRef:
                name: {{ include "tixkit.fullname" . }}-config
            - secretRef:
                name: {{ .Values.secrets.name }}
          resources:
            {{- toYaml .Values.checkout.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tixkit.fullname" . }}-checkout
  labels:
    {{- include "tixkit.labels" . | nindent 4 }}
    app.kubernetes.io/component: checkout
spec:
  selector:
    {{- include "tixkit.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: checkout
  ports:
    - name: http
      port: 80
      targetPort: http
---
