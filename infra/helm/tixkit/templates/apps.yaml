apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tixkit.fullname" . }}-checkout
  labels:
    {{- include "tixkit.labels" . | nindent 4 }}
    app.kubernetes.io/component: checkout
spec:
  replicas: {{ .Values.checkout.replicas }}
  minReadySeconds: {{ .Values.availability.rollingUpdate.minReadySeconds }}
  progressDeadlineSeconds: {{ .Values.availability.rollingUpdate.progressDeadlineSeconds }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.availability.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.availability.rollingUpdate.maxSurge }}
  selector:
    matchLabels:
      {{- include "tixkit.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: checkout
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "tixkit.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: checkout
    spec:
      {{- include "tixkit.podSecurity" (dict "root" . "component" "checkout") | nindent 6 }}
      containers:
        - name: checkout
          image: {{ include "tixkit.image" (dict "Values" .Values "image" .Values.checkout.image "digest" .Values.checkout.imageDigest) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.security.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.checkout.port }}
          envFrom:
            - configMapRef:
                name: {{ include "tixkit.fullname" . }}-config
            - secretRef:
                name: {{ .Values.secrets.name }}
          readinessProbe:
            httpGet:
              path: {{ .Values.checkout.probes.readiness.path | quote }}
              port: http
            initialDelaySeconds: {{ .Values.checkout.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.checkout.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.checkout.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.checkout.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.checkout.probes.liveness.path | quote }}
              port: http
            initialDelaySeconds: {{ .Values.checkout.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.checkout.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.checkout.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.checkout.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.checkout.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tixkit.fullname" . }}-checkout
  labels:
    {{- include "tixkit.labels" . | nindent 4 }}
    app.kubernetes.io/component: checkout
spec:
  selector:
    {{- include "tixkit.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: checkout
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tixkit.fullname" . }}-admin
  labels:
    {{- include "tixkit.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  replicas: {{ .Values.admin.replicas }}
  minReadySeconds: {{ .Values.availability.rollingUpdate.minReadySeconds }}
  progressDeadlineSeconds: {{ .Values.availability.rollingUpdate.progressDeadlineSeconds }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: {{ .Values.availability.rollingUpdate.maxUnavailable }}
      maxSurge: {{ .Values.availability.rollingUpdate.maxSurge }}
  selector:
    matchLabels:
      {{- include "tixkit.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: admin
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "tixkit.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: admin
    spec:
      {{- include "tixkit.podSecurity" (dict "root" . "component" "admin") | nindent 6 }}
      containers:
        - name: admin
          image: {{ include "tixkit.image" (dict "Values" .Values "image" .Values.admin.image "digest" .Values.admin.imageDigest) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.security.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.admin.port }}
          env:
            {{- range $key := list "NODE_ENV" "TIXKIT_DEPLOYMENT_PROFILE" "API_BASE_URL" "TIXKIT_CHECKOUT_URL" "S3_PUBLIC_ENDPOINT" "AUTH_PROVIDER" "ALLOW_INSECURE_LOCAL_ORIGINS" }}
            - name: {{ $key }}
              valueFrom:
                configMapKeyRef:
                  name: {{ include "tixkit.fullname" $ }}-config
                  key: {{ $key }}
            {{- end }}
            {{- with .Values.global.docsUrl }}
            - name: TIXKIT_DOCS_URL
              valueFrom:
                configMapKeyRef:
                  name: {{ include "tixkit.fullname" $ }}-config
                  key: TIXKIT_DOCS_URL
            {{- end }}
            {{- with .Values.global.buildRevision }}
            - name: TIXKIT_BUILD_REVISION
              valueFrom:
                configMapKeyRef:
                  name: {{ include "tixkit.fullname" $ }}-config
                  key: TIXKIT_BUILD_REVISION
            {{- end }}
            - name: CLERK_PUBLISHABLE_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: CLERK_PUBLISHABLE_KEY
            - name: CLERK_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.name }}
                  key: CLERK_SECRET_KEY
          readinessProbe:
            httpGet:
              path: {{ .Values.admin.probes.readiness.path | quote }}
              port: http
            initialDelaySeconds: {{ .Values.admin.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.admin.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.admin.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.admin.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.admin.probes.liveness.path | quote }}
              port: http
            initialDelaySeconds: {{ .Values.admin.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.admin.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.admin.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.admin.probes.liveness.failureThreshold }}
          resources:
            {{- toYaml .Values.admin.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "tixkit.fullname" . }}-admin
  labels:
    {{- include "tixkit.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  selector:
    {{- include "tixkit.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: admin
  ports:
    - name: http
      port: 80
      targetPort: http
