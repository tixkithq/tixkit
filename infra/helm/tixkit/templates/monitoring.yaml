{{- if and .Values.observability.enabled (eq .Values.observability.metrics.mode "service-monitor") }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "tixkit.fullname" . }}-api
  labels:
    {{- include "tixkit.labels" . | nindent 4 }}
    {{- with .Values.observability.metrics.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames: [{{ .Release.Namespace | quote }}]
  selector:
    matchLabels:
      {{- include "tixkit.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.observability.metrics.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.observability.metrics.serviceMonitor.scrapeTimeout }}
      bearerTokenSecret:
        name: {{ .Values.secrets.name }}
        key: METRICS_BEARER_TOKEN
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tixkit.fullname" . }}-metrics-ingress
  labels:
    {{- include "tixkit.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tixkit.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.observability.metrics.serviceMonitor.namespace | quote }}
          {{- with .Values.observability.metrics.serviceMonitor.podSelector }}
          podSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
{{- if .Values.observability.alerts.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "tixkit.fullname" . }}
  labels:
    {{- include "tixkit.labels" . | nindent 4 }}
    {{- with .Values.observability.alerts.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: tixkit.production
      rules:
        - alert: TixkitApiHighErrorRate
          expr: (sum(rate(tixkit_http_request_errors_total{service="tixkit-api"}[5m])) / sum(rate(tixkit_http_request_duration_seconds_count{service="tixkit-api"}[5m])) > {{ .Values.observability.alerts.apiErrorRateThreshold }}) and (sum(rate(tixkit_http_request_duration_seconds_count{service="tixkit-api"}[5m])) > 0)
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: Tixkit API error rate exceeds its production threshold
            runbook_url: {{ .Values.observability.alerts.runbookUrl | quote }}
        - alert: TixkitApiHighP95Latency
          expr: histogram_quantile(0.95, sum by (le) (rate(tixkit_http_request_duration_seconds_bucket{service="tixkit-api"}[5m]))) > {{ .Values.observability.alerts.apiP95LatencySeconds }}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Tixkit API p95 latency exceeds its production threshold
            runbook_url: {{ .Values.observability.alerts.runbookUrl | quote }}
        - alert: TixkitRumLcpP75BudgetExceeded
          expr: (histogram_quantile(0.75, sum by (le, surface) (rate(tixkit_rum_lcp_seconds_bucket{service="tixkit-api"}[{{ .Values.observability.alerts.rumWindow }}]))) > {{ .Values.observability.alerts.rumLcpP75Seconds }}) and on(surface) (sum by (surface) (increase(tixkit_rum_lcp_seconds_count{service="tixkit-api"}[{{ .Values.observability.alerts.rumWindow }}])) >= {{ .Values.observability.alerts.rumMinimumSamples }})
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Buyer LCP p75 exceeds the real-user budget
            runbook_url: {{ .Values.observability.alerts.runbookUrl | quote }}
        - alert: TixkitRumInpP75BudgetExceeded
          expr: (histogram_quantile(0.75, sum by (le, surface) (rate(tixkit_rum_inp_seconds_bucket{service="tixkit-api"}[{{ .Values.observability.alerts.rumWindow }}]))) > {{ .Values.observability.alerts.rumInpP75Seconds }}) and on(surface) (sum by (surface) (increase(tixkit_rum_inp_seconds_count{service="tixkit-api"}[{{ .Values.observability.alerts.rumWindow }}])) >= {{ .Values.observability.alerts.rumMinimumSamples }})
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Buyer INP p75 exceeds the real-user budget
            runbook_url: {{ .Values.observability.alerts.runbookUrl | quote }}
        - alert: TixkitRumClsP75BudgetExceeded
          expr: (histogram_quantile(0.75, sum by (le, surface) (rate(tixkit_rum_cls_score_bucket{service="tixkit-api"}[{{ .Values.observability.alerts.rumWindow }}]))) > {{ .Values.observability.alerts.rumClsP75Score }}) and on(surface) (sum by (surface) (increase(tixkit_rum_cls_score_count{service="tixkit-api"}[{{ .Values.observability.alerts.rumWindow }}])) >= {{ .Values.observability.alerts.rumMinimumSamples }})
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Buyer CLS p75 exceeds the real-user budget
            runbook_url: {{ .Values.observability.alerts.runbookUrl | quote }}
        - alert: TixkitPaymentProviderPlatformFailureRateHigh
          expr: (sum(increase(tixkit_provider_service_attempts_total{surface="payment",outcome="platform_failure"}[{{ .Values.observability.alerts.paymentProviderWindow }}])) / sum(increase(tixkit_provider_service_attempts_total{surface="payment",outcome=~"success|platform_failure"}[{{ .Values.observability.alerts.paymentProviderWindow }}])) > {{ .Values.observability.alerts.paymentProviderPlatformFailureRateThreshold }}) and (sum(increase(tixkit_provider_service_attempts_total{surface="payment",outcome=~"success|platform_failure"}[{{ .Values.observability.alerts.paymentProviderWindow }}])) >= {{ .Values.observability.alerts.paymentProviderMinimumSamples }})
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: Payment provider platform failure rate exceeds its production threshold
            runbook_url: {{ .Values.observability.alerts.runbookUrl | quote }}
        - alert: TixkitPaymentProviderDeclineRateHigh
          expr: (sum(increase(tixkit_provider_service_attempts_total{surface="payment",outcome="decline"}[{{ .Values.observability.alerts.paymentProviderWindow }}])) / sum(increase(tixkit_provider_service_attempts_total{surface="payment",outcome=~"success|decline"}[{{ .Values.observability.alerts.paymentProviderWindow }}])) > {{ .Values.observability.alerts.paymentProviderDeclineRateThreshold }}) and (sum(increase(tixkit_provider_service_attempts_total{surface="payment",outcome=~"success|decline"}[{{ .Values.observability.alerts.paymentProviderWindow }}])) >= {{ .Values.observability.alerts.paymentProviderMinimumSamples }})
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Payment provider decline rate exceeds its separate production threshold
            runbook_url: {{ .Values.observability.alerts.runbookUrl | quote }}
        - alert: TixkitMigrationProgressStalled
          expr: max(tixkit_migration_progress_age_seconds{service="tixkit-worker"} and on(job, instance) (time() - push_time_seconds{job="tixkit-worker"} < {{ .Values.observability.alerts.workerPushFreshnessSeconds }})) > {{ .Values.observability.alerts.migrationProgressAgeSeconds }}
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: A Tixkit migration has stopped making durable progress
            runbook_url: {{ .Values.observability.alerts.runbookUrl | quote }}
{{- end }}
{{- end }}
