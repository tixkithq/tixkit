{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tixkit.fullname" . }}-default-deny
  labels:
    {{- include "tixkit.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tixkit.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tixkit.fullname" . }}-public-ingress
  labels:
    {{- include "tixkit.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tixkit.selectorLabels" . | nindent 6 }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [api, checkout, admin]
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ required "networkPolicy.ingressNamespace is required" .Values.networkPolicy.ingressNamespace | quote }}
      ports:
        - protocol: TCP
          port: 4000
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 3001
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tixkit.fullname" . }}-service-egress
  labels:
    {{- include "tixkit.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tixkit.selectorLabels" . | nindent 6 }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [api, worker]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              {{- include "tixkit.selectorLabels" . | nindent 14 }}
    {{- range .Values.networkPolicy.externalEgressCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        {{- range $.Values.networkPolicy.externalEgressPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
---
{{- if eq .Values.uploads.malwareScanner.mode "clamav" }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tixkit.fullname" . }}-malware-scanner-egress
  labels:
    {{- include "tixkit.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tixkit.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  policyTypes: [Egress]
  egress:
    {{- range .Values.networkPolicy.externalEgressCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: {{ $.Values.uploads.malwareScanner.port }}
    {{- end }}
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tixkit.fullname" . }}-frontend-egress
  labels:
    {{- include "tixkit.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "tixkit.selectorLabels" . | nindent 6 }}
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [checkout, admin]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              {{- include "tixkit.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: 4000
    {{- range .Values.networkPolicy.externalEgressCidrs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
{{- end }}
