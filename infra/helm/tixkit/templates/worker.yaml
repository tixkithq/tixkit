apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tixkit.fullname" . }}-worker
  labels:
    {{- include "tixkit.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels:
      {{- include "tixkit.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        {{- include "tixkit.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- include "tixkit.podSecurity" (dict "root" . "component" "worker") | nindent 6 }}
      containers:
        - name: worker
          image: {{ include "tixkit.image" (dict "Values" .Values "image" .Values.worker.image "digest" .Values.worker.imageDigest) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            {{- toYaml .Values.security.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: worker-ready
              mountPath: /tmp
          livenessProbe:
            exec:
              command: ["node", "packages/workflows/dist/healthcheck.js"]
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 2
          readinessProbe:
            exec:
              command: ["node", "packages/workflows/dist/healthcheck.js"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 2
          envFrom:
            - configMapRef:
                name: {{ include "tixkit.fullname" . }}-config
            - secretRef:
                name: {{ .Values.secrets.name }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      volumes:
        - name: worker-ready
          emptyDir:
            sizeLimit: 16Mi
