{{- include "tixkit.validate" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "tixkit.fullname" . }}-config
  labels:
    {{- include "tixkit.labels" . | nindent 4 }}
data:
  NODE_ENV: {{ .Values.global.environment | quote }}
  TIXKIT_DEPLOYMENT_PROFILE: {{ .Values.deploymentProfile | quote }}
  DB_DRIVER: {{ .Values.database.driver | quote }}
  AUTH_PROVIDER: {{ .Values.auth.provider | quote }}
  API_BASE_URL: {{ .Values.global.apiBaseUrl | quote }}
  ADMIN_DASHBOARD_URL: {{ .Values.global.adminUrl | quote }}
  INTERNAL_API_BASE_URL: {{ printf "http://%s-api:%v" (include "tixkit.fullname" .) .Values.api.port | quote }}
  TIXKIT_CHECKOUT_URL: {{ .Values.global.checkoutUrl | quote }}
  {{- with .Values.global.docsUrl }}
  TIXKIT_DOCS_URL: {{ . | quote }}
  {{- end }}
  S3_PUBLIC_ENDPOINT: {{ .Values.global.s3PublicEndpoint | quote }}
  ALLOW_INSECURE_LOCAL_ORIGINS: "0"
  {{- with .Values.global.buildRevision }}
  TIXKIT_BUILD_REVISION: {{ . | quote }}
  {{- end }}
  CORS_ALLOWED_ORIGINS: {{ join "," .Values.global.corsAllowedOrigins | quote }}
  CUSTOM_DOMAIN_CORS_ENABLED: {{ .Values.global.customDomainCorsEnabled | quote }}
  TRUST_PROXY: {{ .Values.api.trustProxy | quote }}
  PROVIDER_INCIDENT_SINK_ENABLED: {{ .Values.providerIncidentEvidence.enabled | quote }}
  PROVIDER_INCIDENT_CAPTURE_UNTIL: {{ .Values.providerIncidentEvidence.captureUntil | quote }}
  PROVIDER_INCIDENT_RETENTION_MINUTES: {{ .Values.providerIncidentEvidence.retentionMinutes | quote }}
  PROVIDER_INCIDENT_MAX_ACTIVE_PER_TENANT: {{ .Values.providerIncidentEvidence.maxActivePerTenant | quote }}
  PROVIDER_INCIDENT_ACTIVE_KEY_ID: {{ .Values.providerIncidentEvidence.activeKeyId | quote }}
  TEMPORAL_NAMESPACE: {{ .Values.secrets.temporalNamespace | quote }}
  TEMPORAL_TASK_QUEUE: {{ .Values.secrets.temporalTaskQueue | quote }}
  TEMPORAL_TLS_ENABLED: {{ .Values.secrets.temporalTlsEnabled | default false | quote }}
  OIDC_ISSUER_URL: {{ .Values.secrets.oidcIssuerUrl | quote }}
  OIDC_AUDIENCE: {{ .Values.secrets.oidcAudience | quote }}
  OFFLINE_MANIFEST_KEY_ID: {{ .Values.secrets.offlineManifestKeyId | quote }}
  S3_BUCKET: {{ .Values.secrets.s3Bucket | quote }}
  S3_REGION: {{ .Values.secrets.s3Region | quote }}
  S3_AUTH_MODE: {{ .Values.secrets.s3AuthMode | quote }}
  S3_FORCE_PATH_STYLE: {{ .Values.secrets.s3ForcePathStyle | quote }}
  S3_SERVER_SIDE_ENCRYPTION: {{ .Values.secrets.s3ServerSideEncryption | quote }}
  OTEL_SDK_DISABLED: {{ not .Values.observability.enabled | quote }}
  OTEL_EXPORTER_OTLP_PROTOCOL: {{ .Values.observability.otlp.protocol | quote }}
  OTEL_RESOURCE_ATTRIBUTES: {{ .Values.observability.otlp.resourceAttributes | quote }}
  OTEL_TRACES_SAMPLER: {{ .Values.observability.otlp.tracesSampler | quote }}
  OTEL_TRACES_SAMPLER_ARG: {{ .Values.observability.otlp.tracesSamplerArg | quote }}
