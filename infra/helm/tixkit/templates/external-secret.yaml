{{- if eq .Values.secrets.mode "external" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "tixkit.fullname" . }}
  labels:
    {{- include "tixkit.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ required "secrets.externalSecret.secretStoreName is required" .Values.secrets.externalSecret.secretStoreName }}
    kind: {{ .Values.secrets.externalSecret.secretStoreKind }}
  target:
    name: {{ required "secrets.name is required" .Values.secrets.name }}
    creationPolicy: Owner
  data:
    {{- range .Values.secrets.externalSecret.data }}
    {{- if and (ne .secretKey "OFFLINE_MANIFEST_SIGNING_KEY") (ne .secretKey "OFFLINE_MANIFEST_KEY_ID") (ne .secretKey "OFFLINE_MANIFEST_ACTIVE_KEY_ID") (ne .secretKey "OFFLINE_MANIFEST_SIGNING_PRIVATE_KEYS_JSON") }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        {{- toYaml .remoteRef | nindent 8 }}
    {{- end }}
    {{- end }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "tixkit.offlineManifestSecretName" . }}
  labels:
    {{- include "tixkit.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.secrets.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ required "secrets.externalSecret.secretStoreName is required" .Values.secrets.externalSecret.secretStoreName }}
    kind: {{ .Values.secrets.externalSecret.secretStoreKind }}
  target:
    name: {{ include "tixkit.offlineManifestSecretName" . }}
    creationPolicy: Owner
  data:
    {{- range .Values.secrets.externalSecret.data }}
    {{- if or (eq .secretKey "OFFLINE_MANIFEST_SIGNING_KEY") (eq .secretKey "OFFLINE_MANIFEST_KEY_ID") (eq .secretKey "OFFLINE_MANIFEST_ACTIVE_KEY_ID") (eq .secretKey "OFFLINE_MANIFEST_SIGNING_PRIVATE_KEYS_JSON") }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        {{- toYaml .remoteRef | nindent 8 }}
    {{- end }}
    {{- end }}
{{- end }}
