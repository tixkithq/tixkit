deploymentProfile: evaluation

global:
  imageRegistry: ghcr.io/your-org/tixkit
  imagePullPolicy: IfNotPresent
  environment: production
  apiBaseUrl: https://api.tixkit.com
  checkoutUrl: https://checkout.tixkit.com
  adminUrl: https://admin.tixkit.com
  corsAllowedOrigins:
    - https://checkout.tixkit.com
    - https://admin.tixkit.com
  customDomainCorsEnabled: true

database:
  driver: postgres

auth:
  provider: clerk

temporalConnection:
  mode: self-hosted-ha

secrets:
  mode: create
  create: true
  name: tixkit-secrets
  externalSecret:
    secretStoreName: ''
    secretStoreKind: ClusterSecretStore
    refreshInterval: 1h
    data: []
  databaseUrl: postgres://tixkit:tixkit@tixkit-postgres:5432/tixkit
  databaseUrlMysql: ''
  redisUrl: redis://tixkit-redis:6379
  temporalAddress: tixkit-temporal:7233
  temporalApiKey: ''
  temporalTlsCa: ''
  temporalTlsCert: ''
  temporalTlsKey: ''
  temporalTlsEnabled: false
  temporalNamespace: default
  temporalTaskQueue: tixkit-production
  clerkSecretKey: ''
  clerkPublishableKey: ''
  clerkWebhookSecret: ''
  oidcIssuerUrl: ''
  oidcAudience: ''
  stripeSecretKey: ''
  stripeWebhookSecret: ''
  stripePublishableKey: ''
  stripeConnectClientId: ''
  telnyxApiKey: ''
  telnyxWebhookPublicKey: ''
  qrSigningSecret: ''
  offlineManifestSigningKey: ''
  offlineManifestKeyId: manifest:production
  s3Endpoint: http://tixkit-minio:9000
  s3Bucket: tixkit
  s3AccessKeyId: minioadmin
  s3SecretAccessKey: minioadmin
  s3Region: us-east-1
  s3AuthMode: static
  s3ForcePathStyle: true
  s3ServerSideEncryption: none
  otelExporterOtlpEndpoint: ''
  otelExporterOtlpHeaders: ''
  prometheusPushgatewayUrl: ''
  metricsBearerToken: ''
  dashboardCursorSigningKey: ''

api:
  replicas: 2
  image: api
  imageDigest: sha256:1111111111111111111111111111111111111111111111111111111111111111
  port: 4000
  trustProxy: '1'
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: '1'
      memory: 1Gi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

worker:
  replicas: 2
  image: worker
  imageDigest: sha256:2222222222222222222222222222222222222222222222222222222222222222
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: '1'
      memory: 1Gi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

checkout:
  replicas: 2
  image: checkout
  imageDigest: sha256:3333333333333333333333333333333333333333333333333333333333333333
  port: 3000
  probes:
    readiness:
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    liveness:
      path: /health
      initialDelaySeconds: 30
      periodSeconds: 20
      timeoutSeconds: 2
      failureThreshold: 3
  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      cpu: '1'
      memory: 768Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70

admin:
  replicas: 2
  image: admin-dashboard
  imageDigest: sha256:4444444444444444444444444444444444444444444444444444444444444444
  port: 3001
  probes:
    readiness:
      path: /health
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    liveness:
      path: /health
      initialDelaySeconds: 30
      periodSeconds: 20
      timeoutSeconds: 2
      failureThreshold: 3
  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      cpu: '1'
      memory: 768Mi
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

availability:
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
    minReadySeconds: 10
    progressDeadlineSeconds: 600
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  topologySpread:
    enabled: false
    maxSkew: 1
    minDomains: 2
    topologyKey: topology.kubernetes.io/zone

security:
  serviceAccount:
    create: true
    name: ''
    automountServiceAccountToken: false
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    readOnlyRootFilesystem: true
  terminationGracePeriodSeconds: 60

networkPolicy:
  enabled: false
  ingressNamespace: ingress-nginx
  externalEgressCidrs: []
  externalEgressPorts: [443, 3306, 4317, 4318, 5432, 6379, 7233]
  databaseEgressCidrs: []

observability:
  enabled: false
  otlp:
    protocol: http/protobuf
    resourceAttributes: service.namespace=tixkit,deployment.profile=evaluation
    tracesSampler: parentbased_traceidratio
    tracesSamplerArg: '0.10'
  metrics:
    mode: external
    serviceMonitor:
      interval: 30s
      scrapeTimeout: 10s
      namespace: monitoring
      podSelector: {}
      additionalLabels: {}
  alerts:
    enabled: false
    apiErrorRateThreshold: 0.05
    apiP95LatencySeconds: 2
    migrationProgressAgeSeconds: 900
    workerPushFreshnessSeconds: 120
    runbookUrl: https://docs.tixkit.com/operations/incidents
    additionalLabels: {}

migrations:
  enabled: true
  strategy: hook
  execution: install
  invocation: ''
  image: db-migrate
  imageDigest: sha256:5555555555555555555555555555555555555555555555555555555555555555
  backoffLimit: 1
  activeDeadlineSeconds: 900

ingress:
  enabled: false
  className: nginx
  tlsSecretName: tixkit-tls
  apiHost: api.tixkit.com
  checkoutHost: checkout.tixkit.com
  adminHost: admin.tixkit.com
  blockPublicMetrics: true

postgres:
  enabled: true
  image: postgres:16-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
  storageSize: 20Gi
  user: tixkit
  password: tixkit
  database: tixkit

redis:
  enabled: true
  image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99

temporal:
  enabled: true
  image: temporalio/auto-setup:1.24@sha256:98cdb6b5e02d64cb933864a9ba91cb66065eb320623a0dafdf44beba535bca88
  postgresqlImage: postgres:16-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
  postgresqlStorageSize: 10Gi

minio:
  enabled: true
  image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
  storageSize: 20Gi
  rootUser: minioadmin
  rootPassword: minioadmin
