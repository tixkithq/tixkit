deploymentProfile: production

global:
  buildRevision: ''

api:
  imageDigest: ''
  autoscaling:
    enabled: true
worker:
  imageDigest: ''
  autoscaling:
    enabled: true
checkout:
  imageDigest: ''
  autoscaling:
    enabled: true
admin:
  imageDigest: ''
  autoscaling:
    enabled: true
migrations:
  imageDigest: ''
  strategy: manual

secrets:
  mode: existing
  create: false
  name: ''
  s3ServerSideEncryption: AES256

postgres:
  enabled: false
redis:
  enabled: false
temporal:
  enabled: false
minio:
  enabled: false

availability:
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
    minReadySeconds: 10
    progressDeadlineSeconds: 600
  podDisruptionBudget:
    enabled: true
  topologySpread:
    enabled: true

networkPolicy:
  enabled: true
  externalEgressCidrs: []
  databaseEgressCidrs: []

observability:
  enabled: true
  otlp:
    resourceAttributes: service.namespace=tixkit,deployment.profile=production
  metrics:
    mode: service-monitor
  alerts:
    enabled: true
