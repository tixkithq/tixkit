name: Trusted Host Database Dependency Fault

on:
  schedule:
    - cron: '17 8 * * 0'
  workflow_dispatch:
    inputs:
      profile:
        description: Trusted-host database fault profile
        required: true
        default: both
        type: choice
        options:
          - both
          - postgresql-trusted-host-database-loss
          - mysql-trusted-host-database-loss

concurrency:
  group: performance-fault
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fault:
    name: ${{ matrix.profile }}
    runs-on: tixkit-epyc-trusted
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        profile: ${{ fromJSON(inputs.profile == 'postgresql-trusted-host-database-loss' && '["postgresql-trusted-host-database-loss"]' || inputs.profile == 'mysql-trusted-host-database-loss' && '["mysql-trusted-host-database-loss"]' || '["postgresql-trusted-host-database-loss","mysql-trusted-host-database-loss"]') }}
    services:
      database:
        image: ${{ matrix.profile == 'postgresql-trusted-host-database-loss' && 'postgres:16-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb' || 'mysql:8.4@sha256:d36d39a64cd12a5c1cc9e6aa2bfb5f8d4c81a2f6586e0a04a9ae13939db02209' }}
        command: ${{ matrix.profile == 'mysql-trusted-host-database-loss' && '--log-bin-trust-function-creators=1' || '' }}
        env:
          POSTGRES_USER: tixkit
          POSTGRES_PASSWORD: tixkit
          POSTGRES_DB: tixkit
          MYSQL_ROOT_PASSWORD: tixkit
          MYSQL_DATABASE: tixkit
          MYSQL_USER: tixkit
          MYSQL_PASSWORD: tixkit
        ports:
          - ${{ matrix.profile == 'postgresql-trusted-host-database-loss' && '5432:5432' || '3306:3306' }}
        options: >-
          --health-cmd "${{ matrix.profile == 'postgresql-trusted-host-database-loss' && 'pg_isready -U tixkit' || 'mysqladmin ping -h localhost -u tixkit -ptixkit' }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://tixkit:tixkit@localhost:5432/tixkit
      DATABASE_URL_MYSQL: mysql://tixkit:tixkit@localhost:3306/tixkit
      EXPECTED_RUNNER_FINGERPRINT_SHA256: ${{ vars.TIXKIT_EPYC_RUNNER_FINGERPRINT_SHA256 }}
    steps:
      - name: Create private exclusive evidence root
        run: |
          set -euo pipefail
          evidence_root="${RUNNER_TEMP}/tixkit-fault-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.profile }}"
          mkdir -m 700 "${evidence_root}"
          echo "EVIDENCE_ROOT=${evidence_root}" >> "${GITHUB_ENV}"
      - name: Reject non-default or untrusted invocation
        id: invocation
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          case "${GITHUB_EVENT_NAME}" in
            schedule|workflow_dispatch) ;;
            *) echo 'Fault characterization accepts only schedule or workflow_dispatch.' >&2; exit 1 ;;
          esac
          if [ "${GITHUB_REF_TYPE}" != branch ] || [ "${GITHUB_REF}" != "${EXPECTED_REF}" ] || [ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]; then
            echo 'Fault characterization must run from the default branch.' >&2
            exit 1
          fi
      - id: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - id: setup
        uses: ./.github/actions/setup-js
      - id: install
        run: bun install --frozen-lockfile
      - name: Verify privacy-minimized trusted runner identity
        id: identity
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import {
            assertExpectedRunnerFingerprint,
            probeRunnerFingerprint,
          } from './scripts/performance-capacity.mjs';

          const actual = probeRunnerFingerprint();
          appendFileSync(
            process.env.GITHUB_ENV,
            `RUNNER_FINGERPRINT_SHA256=${actual.sha256}\n`,
          );
          assertExpectedRunnerFingerprint(
            process.env.EXPECTED_RUNNER_FINGERPRINT_SHA256,
            actual,
          );
          NODE
      - name: Validate fault contracts
        id: contracts
        run: node --test scripts/__tests__/performance-fault.test.mjs
      - name: Prepare selected pinned database
        id: migration
        run: |
          set -euo pipefail
          if [ "${{ matrix.profile }}" = postgresql-trusted-host-database-loss ]; then
            bun run db:migrate
          else
            bun run db:migrate:mysql
          fi
          bunx turbo run build --filter=@tixkit/db --filter=@tixkit/shared --filter=@tixkit/domain
      - name: Run explicitly authorized bounded database fault
        id: fault
        run: |
          set -euo pipefail
          node scripts/performance-fault.mjs \
            --config performance-faults.trusted.json \
            --profile "${{ matrix.profile }}" \
            --output "${EVIDENCE_ROOT}/database-fault" \
            --git-sha "${GITHUB_SHA}" \
            --container-id "${{ job.services.database.id }}" \
            --expected-runner-fingerprint "${EXPECTED_RUNNER_FINGERPRINT_SHA256}" \
            --authorization "I authorize controlled database service interruption on the dedicated trusted runner"
      - name: Always restore and verify the exact database service
        id: recovery
        if: always()
        env:
          DATABASE_CONTAINER_ID: ${{ job.services.database.id }}
          EXPECTED_DATABASE_IMAGE: ${{ matrix.profile == 'postgresql-trusted-host-database-loss' && 'postgres:16-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb' || 'mysql:8.4@sha256:d36d39a64cd12a5c1cc9e6aa2bfb5f8d4c81a2f6586e0a04a9ae13939db02209' }}
        run: |
          node -e "const {execFileSync}=require('node:child_process'); const id=process.env.DATABASE_CONTAINER_ID||''; const expected=process.env.EXPECTED_DATABASE_IMAGE||''; if(!/^[a-f0-9]{12,64}$/.test(id)||!/^.+@sha256:[a-f0-9]{64}$/.test(expected)) throw new Error('unsafe recovery identity'); const run=(args)=>execFileSync('docker',args,{encoding:'utf8',timeout:30000,maxBuffer:1048576}).trim(); const inspect=()=>{const rows=JSON.parse(run(['inspect',id])); if(!Array.isArray(rows)||rows.length!==1||!String(rows[0].Id).startsWith(id)) throw new Error('database container identity drift'); return rows[0]}; const imageMatches=(row)=>{if(row.Config&&row.Config.Image===expected)return true; if(!/^sha256:[a-f0-9]{64}$/.test(row.Image||''))return false; const images=JSON.parse(run(['image','inspect',row.Image])); const digest=expected.slice(expected.indexOf('@')+1); return images.length===1&&Array.isArray(images[0].RepoDigests)&&images[0].RepoDigests.some(value=>value===expected||value.endsWith('@'+digest))}; let row=inspect(); if(!imageMatches(row))throw new Error('database image drift before recovery'); if(!row.State.Running)run(['start',id]); const deadline=Date.now()+90000; while(Date.now()<deadline){row=inspect(); if(row.State.Running&&row.State.Health&&row.State.Health.Status==='healthy'&&imageMatches(row))process.exit(0); Atomics.wait(new Int32Array(new SharedArrayBuffer(4)),0,0,500)} throw new Error('database did not recover healthy within 90 seconds');"
      - name: Record bounded workflow failure
        if: ${{ always() && job.status != 'success' }}
        env:
          PROFILE: ${{ matrix.profile }}
          DATABASE_IMAGE: ${{ matrix.profile == 'postgresql-trusted-host-database-loss' && 'postgres:16-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb' || 'mysql:8.4@sha256:d36d39a64cd12a5c1cc9e6aa2bfb5f8d4c81a2f6586e0a04a9ae13939db02209' }}
          INVOCATION_OUTCOME: ${{ steps.invocation.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          IDENTITY_OUTCOME: ${{ steps.identity.outcome }}
          CONTRACTS_OUTCOME: ${{ steps.contracts.outcome }}
          MIGRATION_OUTCOME: ${{ steps.migration.outcome }}
          FAULT_OUTCOME: ${{ steps.fault.outcome }}
          RECOVERY_OUTCOME: ${{ steps.recovery.outcome }}
        run: |
          node -e "const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'); const names=['invocation','checkout','setup','install','identity','contracts','migration','fault','recovery']; const outcomes=Object.fromEntries(names.map(name=>[name,process.env[name.toUpperCase()+'_OUTCOME']||'skipped'])); const phase=names.find(name=>['failure','cancelled'].includes(outcomes[name]))||'workflow'; const configPath=path.join(process.env.GITHUB_WORKSPACE||process.cwd(),'performance-faults.trusted.json'); const configSha256=outcomes.checkout==='success'&&fs.existsSync(configPath)?crypto.createHash('sha256').update(fs.readFileSync(configPath)).digest('hex'):null; const runnerFingerprintSha256=/^[a-f0-9]{64}$/.test(process.env.RUNNER_FINGERPRINT_SHA256||'')?process.env.RUNNER_FINGERPRINT_SHA256:null; const runnerFingerprint=runnerFingerprintSha256?{version:'tixkit-runner-fingerprint-v2',sha256:runnerFingerprintSha256}:null; const payload={schemaVersion:'tixkit-performance-fault-failure-v2',status:'failed',phase,outcomes,profile:process.env.PROFILE,runnerLabel:'tixkit-epyc-trusted',runnerFingerprint,databaseImage:process.env.DATABASE_IMAGE,configSha256,gitSha:process.env.GITHUB_SHA,failedAt:new Date().toISOString(),integrityModel:'checksums-not-signatures'}; const canonical=v=>Array.isArray(v)?v.map(canonical):v&&typeof v==='object'?Object.fromEntries(Object.keys(v).sort().map(k=>[k,canonical(v[k])])):v; const artifact={...payload,failureSha256:crypto.createHash('sha256').update(JSON.stringify(canonical(payload))).digest('hex')}; fs.writeFileSync(path.join(process.env.EVIDENCE_ROOT,'workflow-failure.json'),JSON.stringify(artifact,null,2)+'\n',{flag:'wx',mode:0o600});"
      - name: Upload complete or failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fault-${{ matrix.profile }}
          path: ${{ env.EVIDENCE_ROOT }}
          if-no-files-found: error
          retention-days: 90
