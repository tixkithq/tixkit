name: SDK Release Dry Run

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    name: SDK Parity Matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Verify GitHub Action refs are pinned
        run: infra/ci/scripts/verify-github-action-pins.sh
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
      - name: Verify SDK parity matrix
        run: |
          node scripts/validate-public-distribution.mjs
          node scripts/sdk-parity-matrix.mjs
          node scripts/sdk-demo-matrix.mjs --check

  public-npm-dry-run:
    name: Public NPM Package Dry Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: ./.github/actions/setup-js
      - run: bun install --frozen-lockfile
      - name: Pack every manifest-declared npm package
        run: bun run release:public:npm:dry-run
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: public-npm-release-provenance
          path: public-release-provenance/
          if-no-files-found: error

  flutter-sdk-dry-run:
    name: Flutter SDK Dry Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.22.x'
          channel: stable
          cache: true
      - name: Validate Flutter package
        run: |
          set -euo pipefail
          mkdir -p sdk-release-provenance
          cd packages/sdk-flutter
          flutter pub get 2>&1 | tee ../../sdk-release-provenance/flutter-pub-get.log
          flutter analyze 2>&1 | tee ../../sdk-release-provenance/flutter-analyze.log
          flutter test 2>&1 | tee ../../sdk-release-provenance/flutter-test.log
          flutter pub publish --dry-run 2>&1 | tee ../../sdk-release-provenance/flutter-publish-dry-run.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: flutter-sdk-dry-run-provenance
          path: sdk-release-provenance/
          if-no-files-found: error

  ios-sdk-dry-run:
    name: iOS SDK Dry Run
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Build and test Swift package
        run: |
          set -euo pipefail
          mkdir -p sdk-release-provenance
          (cd packages/sdk-ios && swift build) 2>&1 | tee sdk-release-provenance/ios-swift-build.log
          (cd packages/sdk-ios && swift test) 2>&1 | tee sdk-release-provenance/ios-swift-test.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: ios-sdk-dry-run-provenance
          path: sdk-release-provenance/
          if-no-files-found: error

  android-sdk-dry-run:
    name: Android SDK Dry Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3 # v6
      - name: Build, test, and publish Android package locally
        run: |
          set -euo pipefail
          mkdir -p sdk-release-provenance
          (cd packages/sdk-android && ./gradlew build test) 2>&1 | tee sdk-release-provenance/android-gradle-build-test.log
          (cd packages/sdk-android && ./gradlew :example:testDebugUnitTest) 2>&1 | tee sdk-release-provenance/android-example-test.log
          (cd packages/sdk-android && ./gradlew :sdk:publishToMavenLocal) 2>&1 | tee sdk-release-provenance/android-publish-to-maven-local.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: android-sdk-dry-run-provenance
          path: sdk-release-provenance/
          if-no-files-found: error

  go-sdk-dry-run:
    name: Go SDK Dry Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: packages/sdk-go/go.mod
          cache-dependency-path: packages/sdk-go/go.mod
      - name: Build, test, vet, and pack Go SDK
        run: |
          set -euo pipefail
          mkdir -p sdk-release-provenance
          (
            cd packages/sdk-go
            go list -m -json
            go list ./...
            test -z "$(gofmt -l *.go)"
            go test ./...
            go vet ./...
            go build ./examples/...
          ) 2>&1 | tee sdk-release-provenance/go-sdk-dry-run.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: go-sdk-dry-run-provenance
          path: sdk-release-provenance/
          if-no-files-found: error

  rust-sdk-dry-run:
    name: Rust SDK Dry Run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # master
        with:
          toolchain: 1.93.0
          components: clippy,rustfmt
      - name: Build, test, lint, and package Rust SDK
        run: |
          set -euo pipefail
          mkdir -p sdk-release-provenance
          (
            cd packages/sdk-rust
            cargo fmt --check
            cargo clippy --all-targets -- -D warnings
            cargo test
            cargo build --examples
            cargo package --allow-dirty
          ) 2>&1 | tee sdk-release-provenance/rust-sdk-dry-run.log
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: rust-sdk-dry-run-provenance
          path: sdk-release-provenance/
          if-no-files-found: error
