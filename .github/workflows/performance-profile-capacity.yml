name: Supported Profile Capacity Characterization

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Reviewed supported deployment profile
        required: true
        type: choice
        options: [compact, production]
      release_tag:
        description: Immutable public release tag (vX.Y.Z)
        required: true
        type: string

concurrency:
  group: supported-profile-capacity-${{ inputs.profile }}
  cancel-in-progress: false

permissions:
  attestations: read
  contents: read

jobs:
  characterize:
    runs-on: [self-hosted, tixkit-supported-profile-capacity, '${{ inputs.profile }}']
    environment: supported-profile-capacity-${{ inputs.profile }}
    timeout-minutes: 240
    steps:
      - name: Reject an unreviewed invocation
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "${GITHUB_EVENT_NAME}" == workflow_dispatch ]]
          [[ "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
      - name: Download and attest the immutable public release manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          mkdir -m 700 "${RUNNER_TEMP}/supported-profile-release"
          gh release download "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" \
            --pattern public-release-manifest.json --dir "${RUNNER_TEMP}/supported-profile-release"
          gh attestation verify "${RUNNER_TEMP}/supported-profile-release/public-release-manifest.json" \
            --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/public-artifact-release.yml" \
            --source-ref "refs/tags/${RELEASE_TAG}" --deny-self-hosted-runners
          checked_out_commit="$(git rev-parse HEAD)"
          manifest_commit="$(jq -er '.core.sourceCommit | select(test("^[a-f0-9]{40}$"))' \
            "${RUNNER_TEMP}/supported-profile-release/public-release-manifest.json")"
          [[ "${checked_out_commit}" == "${manifest_commit}" ]]
      - uses: ./.github/actions/setup-js
      - run: bun install --frozen-lockfile
      - name: Prepare private execution inputs
        env:
          COMPACT_ENV_BASE64: ${{ secrets.TIXKIT_COMPACT_ENV_BASE64 }}
          PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          evidence_root="${RUNNER_TEMP}/supported-profile-capacity-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -m 700 "${evidence_root}"
          echo "EVIDENCE_ROOT=${evidence_root}" >> "${GITHUB_ENV}"
          if [[ "${PROFILE}" == compact ]]; then
            [[ -n "${COMPACT_ENV_BASE64}" ]]
            umask 077
            printf '%s' "${COMPACT_ENV_BASE64}" | base64 --decode > "${RUNNER_TEMP}/compact.env"
          fi
      - name: Start exact Compact public images
        if: ${{ inputs.profile == 'compact' }}
        env:
          RELEASE_MANIFEST: ${{ runner.temp }}/supported-profile-release/public-release-manifest.json
        run: |
          set -euo pipefail
          api_image="$(jq -r '.core.images[] | select(.name == "api") | .reference' "${RELEASE_MANIFEST}")"
          worker_image="$(jq -r '.core.images[] | select(.name == "worker") | .reference' "${RELEASE_MANIFEST}")"
          checkout_image="$(jq -r '.core.images[] | select(.name == "checkout") | .reference' "${RELEASE_MANIFEST}")"
          admin_image="$(jq -r '.core.images[] | select(.name == "admin") | .reference' "${RELEASE_MANIFEST}")"
          [[ "${api_image}" == *@sha256:* && "${worker_image}" == *@sha256:* ]]
          [[ "${checkout_image}" == *@sha256:* && "${admin_image}" == *@sha256:* ]]
          TIXKIT_API_IMAGE="${api_image}" TIXKIT_WORKER_IMAGE="${worker_image}" \
            TIXKIT_CHECKOUT_IMAGE="${checkout_image}" TIXKIT_ADMIN_IMAGE="${admin_image}" \
            docker compose --env-file "${RUNNER_TEMP}/compact.env" -f infra/compact/compose.yml up -d --no-build
      - name: Prove Production placement without disruption
        if: ${{ inputs.profile == 'production' }}
        env:
          EXPECTED_KUBE_CONTEXT: ${{ vars.TIXKIT_CAPACITY_KUBE_CONTEXT }}
          NAMESPACE: ${{ vars.TIXKIT_CAPACITY_KUBE_NAMESPACE }}
          RELEASE_NAME: ${{ vars.TIXKIT_CAPACITY_HELM_RELEASE }}
        run: |
          set -euo pipefail
          proof_root="${RUNNER_TEMP}/supported-profile-production-proof"
          mkdir -m 700 "${proof_root}"
          DRILL_ID="capacity-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" EVIDENCE_DIR="${proof_root}" \
            infra/scripts/verify-production-profile.sh
          proof_file="${proof_root}/capacity-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          [[ -f "${proof_file}" && ! -L "${proof_file}" ]]
          echo "PRODUCTION_PROFILE_PROOF=${proof_file}" >> "${GITHUB_ENV}"
      - name: Attest runtime topology before output or load
        env:
          PROFILE: ${{ inputs.profile }}
          RELEASE_MANIFEST: ${{ runner.temp }}/supported-profile-release/public-release-manifest.json
          EXPECTED_TOPOLOGY_SHA256: ${{ vars.TIXKIT_EXPECTED_PROFILE_TOPOLOGY_SHA256 }}
          EXPECTED_KUBE_CONTEXT: ${{ vars.TIXKIT_CAPACITY_KUBE_CONTEXT }}
          KUBE_NAMESPACE: ${{ vars.TIXKIT_CAPACITY_KUBE_NAMESPACE }}
          HELM_RELEASE: ${{ vars.TIXKIT_CAPACITY_HELM_RELEASE }}
          EXTERNAL_HA_ATTESTATION_SHA256: ${{ vars.TIXKIT_EXTERNAL_HA_ATTESTATION_SHA256 }}
          EXTERNAL_HA_ATTESTATION_PATH: ${{ vars.TIXKIT_EXTERNAL_HA_ATTESTATION_PATH }}
          CAPACITY_API_ORIGIN: ${{ vars.TIXKIT_CAPACITY_API_ORIGIN }}
          CAPACITY_FIXTURE_ORIGIN: ${{ vars.TIXKIT_CAPACITY_FIXTURE_ORIGIN }}
          FIXTURE_SERVICE_ARTIFACT_SHA256: ${{ vars.TIXKIT_CAPACITY_FIXTURE_ARTIFACT_SHA256 }}
          FIXTURE_SERVICE_ARTIFACT_PATH: ${{ vars.TIXKIT_CAPACITY_FIXTURE_ARTIFACT_PATH }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh attestation verify "${FIXTURE_SERVICE_ARTIFACT_PATH}" --repo "${GITHUB_REPOSITORY}" \
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/public-artifact-release.yml" \
            --source-ref "refs/tags/${RELEASE_TAG}" --deny-self-hosted-runners
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { lstatSync, readFileSync, realpathSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          import { createCapacityProofProjection, createReviewedTopologyFingerprint, createTargetBinding, createTopologyFingerprint } from './scripts/performance-profile-capacity.mjs';
          import { canonicalJson, sha256 } from './scripts/performance-evidence.mjs';
          const manifest = JSON.parse(readFileSync(process.env.RELEASE_MANIFEST, 'utf8'));
          const images = Object.fromEntries(manifest.core.images.map(({name,digest}) => [name,digest]));
          const exact = (value, pattern, label) => { if (!pattern.test(value ?? '')) throw new Error(`${label} is invalid`); return value; };
          const canonicalProof=(input,label,maximumBytes)=>{const absolute=path.resolve(input);const metadata=lstatSync(absolute);if(!metadata.isFile()||metadata.isSymbolicLink()||realpathSync(absolute)!==absolute||metadata.size<1||metadata.size>maximumBytes)throw new Error(`${label} must be a bounded direct file`);const bytes=readFileSync(absolute);let value;try{value=JSON.parse(bytes);}catch{throw new Error(`${label} must be JSON`);}const canonical=Buffer.from(`${canonicalJson(value)}\n`);if(!bytes.equals(canonical))throw new Error(`${label} must be canonical JSON`);return {bytes:canonical,value};};
          exact(process.env.FIXTURE_SERVICE_ARTIFACT_SHA256,/^[a-f0-9]{64}$/u,'fixture service artifact');const fixtureArtifact=canonicalProof(process.env.FIXTURE_SERVICE_ARTIFACT_PATH,'fixture service artifact',1024*1024);if(sha256(fixtureArtifact.bytes)!==process.env.FIXTURE_SERVICE_ARTIFACT_SHA256)throw new Error('fixture service artifact bytes drifted');const fixtureProjection=createCapacityProofProjection('fixture-service-artifact',fixtureArtifact.value,sha256(fixtureArtifact.bytes));if(fixtureProjection.sourceCommit!==manifest.core.sourceCommit)throw new Error('fixture service artifact source commit drifted');
          const targetBinding=createTargetBinding({profile:process.env.PROFILE,apiOrigin:process.env.CAPACITY_API_ORIGIN,fixtureOrigin:process.env.CAPACITY_FIXTURE_ORIGIN,apiImageDigest:images.api,fixtureServiceArtifactSha256:process.env.FIXTURE_SERVICE_ARTIFACT_SHA256,fixtureDeploymentSha256:fixtureProjection.deploymentSha256,fixtureIdentityPublicKeyPem:fixtureProjection.identityPublicKeyPem});
          const proofDirectory=`${process.env.EVIDENCE_ROOT}/proofs`;execFileSync('mkdir',['-m','700',proofDirectory]);writeFileSync(`${proofDirectory}/fixture-service-artifact.json`,`${canonicalJson(fixtureProjection)}\n`,{flag:'wx',mode:0o600});
          let descriptor;
          if (process.env.PROFILE === 'compact') {
            const compose = (args) => execFileSync('docker', ['compose','--env-file',`${process.env.RUNNER_TEMP}/compact.env`,'-f','infra/compact/compose.yml',...args], {encoding:'utf8'}).trim();
            const inspect = (service) => JSON.parse(execFileSync('docker',['inspect',compose(['ps','-q',service])],{encoding:'utf8'}))[0];
            const component = (service, digest) => { const row=inspect(service); if(row.State?.Health?.Status!=='healthy'||row.HostConfig?.NanoCpus!==1_000_000_000||row.HostConfig?.Memory!==1_073_741_824||!row.Config?.Image?.endsWith(`@${digest}`)) throw new Error(`${service} runtime identity drifted`); return {replicas:1,cpuQuotaMillis:1000,memoryLimitMiB:1024,imageDigest:digest}; };
            const published=inspect('api').NetworkSettings?.Ports?.['4000/tcp'];if(!Array.isArray(published)||published.length!==1||published[0]?.HostIp!=='127.0.0.1'||!/^[0-9]{1,5}$/u.test(published[0]?.HostPort??'')||new URL(process.env.CAPACITY_API_ORIGIN).origin!==`http://127.0.0.1:${published[0].HostPort}`)throw new Error('Compact capacity API origin is not the inspected runner-bound endpoint');
            const postgres=inspect('postgres'); if(postgres.State?.Health?.Status!=='healthy') throw new Error('Compact database is not healthy');
            descriptor={schemaVersion:'tixkit-supported-profile-runtime-descriptor-v1',profile:'compact',claimBounds:{surface:'api-checkout-reservation',dependencyScope:'runtime-topology-bound-dependencies-not-independently-characterized',hostCapacity:'not-characterized'},targetBinding,deployment:'compact-compose',database:{engine:'postgresql',topology:'bundled-single-instance'},api:component('api',images.api),worker:component('worker',images.worker)};
          } else {
            const context=exact(process.env.EXPECTED_KUBE_CONTEXT,/^[A-Za-z0-9._-]{1,128}$/u,'Kubernetes context');
            const namespace=exact(process.env.KUBE_NAMESPACE,/^[a-z0-9]([-a-z0-9]*[a-z0-9])?$/u,'namespace');
            const release=exact(process.env.HELM_RELEASE,/^[A-Za-z0-9._-]{1,128}$/u,'Helm release');
            exact(process.env.EXTERNAL_HA_ATTESTATION_SHA256,/^[a-f0-9]{64}$/u,'external HA attestation');
            const haAttestation=canonicalProof(process.env.EXTERNAL_HA_ATTESTATION_PATH,'external HA attestation',1024*1024);if(sha256(haAttestation.bytes)!==process.env.EXTERNAL_HA_ATTESTATION_SHA256)throw new Error('external HA attestation bytes drifted');const haProjection=createCapacityProofProjection('external-ha-attestation',haAttestation.value,sha256(haAttestation.bytes));writeFileSync(`${proofDirectory}/external-ha-attestation.json`,`${canonicalJson(haProjection)}\n`,{flag:'wx',mode:0o600});
            if(execFileSync('kubectl',['config','current-context'],{encoding:'utf8'}).trim()!==context) throw new Error('Kubernetes context drifted');
            const component=(name,digest)=>{const selector=`app.kubernetes.io/instance=${release},app.kubernetes.io/component=${name}`;const rows=JSON.parse(execFileSync('kubectl',['--context',context,'-n',namespace,'get','deployment','-l',selector,'-o','json'],{encoding:'utf8'}));if(rows.items.length!==1)throw new Error(`${name} deployment cardinality drifted`);const row=rows.items[0],container=row.spec?.template?.spec?.containers?.[0],revision=row.metadata?.annotations?.['deployment.kubernetes.io/revision'];if(row.spec?.replicas!==2||row.status?.readyReplicas!==2||row.status?.updatedReplicas!==2||row.status?.availableReplicas!==2||row.status?.observedGeneration!==row.metadata?.generation||!/^\d+$/u.test(revision??'')||container?.resources?.limits?.cpu!=='1'||container?.resources?.limits?.memory!=='1Gi'||!container?.image?.endsWith(`@${digest}`))throw new Error(`${name} runtime identity drifted`);const replicaSets=JSON.parse(execFileSync('kubectl',['--context',context,'-n',namespace,'get','replicaset','-l',selector,'-o','json'],{encoding:'utf8'})).items.filter((item)=>item.metadata?.ownerReferences?.some((owner)=>owner.controller===true&&owner.kind==='Deployment'&&owner.uid===row.metadata.uid)&&item.metadata?.annotations?.['deployment.kubernetes.io/revision']===revision&&item.status?.readyReplicas===2);if(replicaSets.length!==1)throw new Error(`${name} ReplicaSet revision drifted`);const replicaSet=replicaSets[0],templateHash=replicaSet.metadata?.labels?.['pod-template-hash'];if(!/^[A-Za-z0-9._-]{1,128}$/u.test(templateHash??''))throw new Error(`${name} template hash drifted`);const pods=JSON.parse(execFileSync('kubectl',['--context',context,'-n',namespace,'get','pods','-l',selector,'-o','json'],{encoding:'utf8'})).items;const readyPods=pods.filter(({metadata,spec,status})=>status?.conditions?.some(({type,status})=>type==='Ready'&&status==='True')&&status?.containerStatuses?.[0]?.ready===true&&metadata?.labels?.['pod-template-hash']===templateHash&&metadata?.ownerReferences?.some((owner)=>owner.controller===true&&owner.kind==='ReplicaSet'&&owner.uid===replicaSet.metadata.uid)&&spec?.containers?.[0]?.resources?.limits?.cpu==='1'&&spec?.containers?.[0]?.resources?.limits?.memory==='1Gi'&&spec?.containers?.[0]?.image?.endsWith(`@${digest}`));const podIdentities=readyPods.map(({metadata,status})=>({uid:metadata.uid,imageID:status.containerStatuses[0].imageID})).sort((left,right)=>left.uid.localeCompare(right.uid));if(podIdentities.length!==2||podIdentities.some(({uid,imageID})=>typeof uid!=='string'||typeof imageID!=='string'||!imageID.endsWith(`@${digest}`)))throw new Error(`${name} ready Pod revision, resource, or image identity drifted`);return {replicas:2,cpuQuotaMillis:1000,memoryLimitMiB:1024,imageDigest:digest,deploymentRevisionSha256:sha256(revision),templateHashSha256:sha256(templateHash),readyPodIdentitiesSha256:sha256(canonicalJson(podIdentities))};};
            const productionProof=canonicalProof(process.env.PRODUCTION_PROFILE_PROOF,'Production profile proof',4*1024*1024);const productionProjection=createCapacityProofProjection('production-profile',productionProof.value,sha256(productionProof.bytes));writeFileSync(`${proofDirectory}/production-profile.json`,`${canonicalJson(productionProjection)}\n`,{flag:'wx',mode:0o600});
            descriptor={schemaVersion:'tixkit-supported-profile-runtime-descriptor-v1',profile:'production',claimBounds:{surface:'api-checkout-reservation',dependencyScope:'runtime-topology-bound-dependencies-not-independently-characterized',hostCapacity:'not-characterized'},targetBinding,deployment:'production-helm',cluster:{contextSha256:sha256(context),namespaceSha256:sha256(namespace),releaseSha256:sha256(release),profileProofSha256:sha256(productionProof.bytes)},database:{engine:'postgresql',topology:'external-high-availability',attestationSha256:process.env.EXTERNAL_HA_ATTESTATION_SHA256},api:component('api',images.api),worker:component('worker',images.worker)};
          }
          const reviewedTopologyFingerprint=createReviewedTopologyFingerprint(descriptor);if(reviewedTopologyFingerprint.sha256!==process.env.EXPECTED_TOPOLOGY_SHA256) throw new Error('supported-profile reviewed topology fingerprint does not match reviewed identity');const observedDescriptor={schemaVersion:'tixkit-supported-profile-observed-topology-v1',reviewedTopologyFingerprint,observation:descriptor};const topologyFingerprint=createTopologyFingerprint(observedDescriptor);
          writeFileSync(`${process.env.EVIDENCE_ROOT}/runtime-descriptor.json`,`${canonicalJson(observedDescriptor)}\n`,{flag:'wx',mode:0o600});writeFileSync(`${process.env.EVIDENCE_ROOT}/runtime.json`,`${canonicalJson({topologyFingerprint,reviewedTopologyFingerprint,targetBinding,images})}\n`,{flag:'wx',mode:0o600});
          NODE
      - name: Validate contracts before load
        run: node --test scripts/__tests__/performance-profile-capacity.test.mjs scripts/__tests__/performance-profile-capacity-workflow.test.mjs
      - name: Run profile-owned checkout reservation workload
        env:
          PROFILE: ${{ inputs.profile }}
          RELEASE_MANIFEST: ${{ runner.temp }}/supported-profile-release/public-release-manifest.json
          TIXKIT_CAPACITY_API_ORIGIN: ${{ vars.TIXKIT_CAPACITY_API_ORIGIN }}
          TIXKIT_CAPACITY_FIXTURE_ORIGIN: ${{ vars.TIXKIT_CAPACITY_FIXTURE_ORIGIN }}
          TIXKIT_CAPACITY_FIXTURE_AUTHORIZATION: ${{ secrets.TIXKIT_CAPACITY_FIXTURE_AUTHORIZATION }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { canonicalJson } from './scripts/performance-evidence.mjs';
          import { createSupportedProfileCapacityEvidence, executeSupportedProfileCapacitySample } from './scripts/performance-profile-capacity.mjs';
          import { runCheckoutReservationWorkload } from './scripts/performance-profile-capacity-workload.mjs';
          const config=JSON.parse(readFileSync('performance-capacity.supported-profiles.json','utf8'));const profile=config.profiles.find(({id})=>id===process.env.PROFILE);if(!profile)throw new Error('unknown profile');
          const releaseManifestBytes=readFileSync(process.env.RELEASE_MANIFEST);const releaseManifest=JSON.parse(releaseManifestBytes);const images=Object.fromEntries(releaseManifest.core.images.map(({name,digest})=>[name,digest]));const runtime=JSON.parse(readFileSync(`${process.env.EVIDENCE_ROOT}/runtime.json`,'utf8'));const fixtureProjection=JSON.parse(readFileSync(`${process.env.EVIDENCE_ROOT}/proofs/fixture-service-artifact.json`,'utf8'));
          const rawDirectory=`${process.env.EVIDENCE_ROOT}/raw`;mkdirSync(rawDirectory,{mode:0o700});const rawSamples=[];let sequence=0;const totalSamples=profile.workload.concurrencyPoints.length*profile.workload.samplesPerPoint;const minimumReservationActiveLoadMs=Math.ceil(profile.workload.minimumDurationSeconds*1000/totalSamples);
          for(const concurrency of profile.workload.concurrencyPoints){for(let sample=1;sample<=profile.workload.samplesPerPoint;sample+=1){sequence+=1;const bytes=await executeSupportedProfileCapacitySample({profile,releaseImages:images,topologyFingerprint:runtime.topologyFingerprint,targetBinding:runtime.targetBinding,sequence,concurrency,executeWorkload:(input)=>runCheckoutReservationWorkload({...input,apiOrigin:process.env.TIXKIT_CAPACITY_API_ORIGIN,fixtureOrigin:process.env.TIXKIT_CAPACITY_FIXTURE_ORIGIN,deploymentProfile:profile.id,apiImageDigest:images.api,fixtureServiceArtifactSha256:runtime.targetBinding.fixtureServiceArtifactSha256,fixtureServiceDeploymentSha256:fixtureProjection.deploymentSha256,fixtureIdentityPublicKeyPem:fixtureProjection.identityPublicKeyPem,targetBinding:runtime.targetBinding,authorization:process.env.TIXKIT_CAPACITY_FIXTURE_AUTHORIZATION,minimumReservationActiveLoadMs})});writeFileSync(`${rawDirectory}/${String(sequence).padStart(3,'0')}.json`,bytes,{flag:'wx',mode:0o600});rawSamples.push(bytes);}}
          const {execFileSync}=await import('node:child_process');const sourceCommit=execFileSync('/usr/bin/git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();const gitTree=execFileSync('/usr/bin/git',['rev-parse','HEAD^{tree}'],{encoding:'utf8'}).trim();const evidence=createSupportedProfileCapacityEvidence({config,profileId:profile.id,sourceCommit,gitTree,releaseManifest,releaseManifestBytes,rawSamples,topologyFingerprint:runtime.topologyFingerprint,targetBinding:runtime.targetBinding,capacityClaim:{surface:'api-checkout-reservation',dependencyScope:'runtime-topology-bound-dependencies-not-independently-characterized',hostCapacity:'not-characterized',maxPublishableConcurrency:64,saturationObservedAtConcurrency:128}});writeFileSync(`${process.env.EVIDENCE_ROOT}/evidence.json`,`${canonicalJson(evidence)}\n`,{flag:'wx',mode:0o600});
          NODE
      - name: Upload checksum-bound evidence for independent signing and review
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: supported-profile-capacity-${{ inputs.profile }}
          path: ${{ env.EVIDENCE_ROOT }}
          if-no-files-found: error
          retention-days: 30
      - name: Stop Compact runtime
        if: ${{ always() && inputs.profile == 'compact' }}
        run: docker compose --env-file "${RUNNER_TEMP}/compact.env" -f infra/compact/compose.yml down --volumes
