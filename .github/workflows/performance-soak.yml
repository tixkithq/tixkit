name: Trusted Host Continuous Integration Soak

on:
  schedule:
    - cron: '13 3 * * 6'
  workflow_dispatch:
    inputs:
      profile:
        description: Trusted-host integration soak profile
        required: true
        default: both
        type: choice
        options:
          - both
          - postgresql-trusted-host-integration-soak
          - mysql-trusted-host-integration-soak

concurrency:
  group: performance-soak
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  soak:
    name: ${{ matrix.profile }}
    runs-on: tixkit-epyc-trusted
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        profile: ${{ fromJSON(inputs.profile == 'postgresql-trusted-host-integration-soak' && '["postgresql-trusted-host-integration-soak"]' || inputs.profile == 'mysql-trusted-host-integration-soak' && '["mysql-trusted-host-integration-soak"]' || '["postgresql-trusted-host-integration-soak","mysql-trusted-host-integration-soak"]') }}
    services:
      database:
        image: ${{ matrix.profile == 'postgresql-trusted-host-integration-soak' && 'postgres:16-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb' || 'mysql:8.4@sha256:d36d39a64cd12a5c1cc9e6aa2bfb5f8d4c81a2f6586e0a04a9ae13939db02209' }}
        command: ${{ matrix.profile == 'mysql-trusted-host-integration-soak' && '--log-bin-trust-function-creators=1' || '' }}
        env:
          POSTGRES_USER: tixkit
          POSTGRES_PASSWORD: tixkit
          POSTGRES_DB: tixkit
          MYSQL_ROOT_PASSWORD: tixkit
          MYSQL_DATABASE: tixkit
          MYSQL_USER: tixkit
          MYSQL_PASSWORD: tixkit
        ports:
          - ${{ matrix.profile == 'postgresql-trusted-host-integration-soak' && '5432:5432' || '3306:3306' }}
        options: >-
          --health-cmd "${{ matrix.profile == 'postgresql-trusted-host-integration-soak' && 'pg_isready -U tixkit' || 'mysqladmin ping -h localhost -u tixkit -ptixkit' }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://tixkit:tixkit@localhost:5432/tixkit
      DATABASE_URL_MYSQL: mysql://tixkit:tixkit@localhost:3306/tixkit
    steps:
      - name: Create private success and failure roots
        id: evidence-root
        run: |
          set -euo pipefail
          evidence_root="${RUNNER_TEMP}/tixkit-soak-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.profile }}"
          failure_root="${RUNNER_TEMP}/tixkit-soak-failure-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.profile }}"
          mkdir -m 700 "${evidence_root}" "${failure_root}"
          echo "EVIDENCE_ROOT=${evidence_root}" >> "${GITHUB_ENV}"
          echo "FAILURE_ROOT=${failure_root}" >> "${GITHUB_ENV}"
      - name: Reject non-default or untrusted invocation before checkout
        id: invocation
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          case "${GITHUB_EVENT_NAME}" in
            schedule|workflow_dispatch) ;;
            *) echo 'Integration soak accepts only schedule or workflow_dispatch.' >&2; exit 1 ;;
          esac
          if [ "${GITHUB_REF_TYPE}" != branch ] || [ "${GITHUB_REF}" != "${EXPECTED_REF}" ] || [ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]; then
            echo 'Integration soak must run from the default branch.' >&2
            exit 1
          fi
      - id: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - id: setup
        uses: ./.github/actions/setup-js
      - id: install
        run: bun install --frozen-lockfile
      - name: Validate soak contracts
        id: contracts
        run: node --test scripts/__tests__/performance-soak.test.mjs
      - name: Migrate only the selected database
        id: migration
        run: |
          set -euo pipefail
          if [ "${{ matrix.profile }}" = postgresql-trusted-host-integration-soak ]; then
            bun run db:migrate
          else
            bun run db:migrate:mysql
          fi
          bunx turbo run build --filter=@tixkit/db --filter=@tixkit/shared --filter=@tixkit/domain
      - name: Run four-hour continuous integration soak
        id: soak
        run: |
          set -euo pipefail
          node scripts/performance-soak.mjs \
            --config performance-soak.trusted.json \
            --profile "${{ matrix.profile }}" \
            --output "${EVIDENCE_ROOT}/run" \
            --git-sha "${GITHUB_SHA}"
      - name: Recover process group and verify selected database
        id: recovery
        if: always()
        env:
          DATABASE_CONTAINER_ID: ${{ job.services.database.id }}
        run: |
          set -euo pipefail
          process_group_path="${EVIDENCE_ROOT}/run/active-process-group"
          if [ -f "${process_group_path}" ]; then
            process_group="$(tr -d '\n' < "${process_group_path}")"
            case "${process_group}" in (*[!0-9]*|'') echo 'Unsafe process-group identity.' >&2; exit 1;; esac
            kill -TERM -- "-${process_group}" 2>/dev/null || true
            sleep 2
            kill -KILL -- "-${process_group}" 2>/dev/null || true
            if kill -0 -- "-${process_group}" 2>/dev/null; then
              echo 'Soak process-group descendants survived cleanup.' >&2
              exit 1
            fi
            rm -f "${process_group_path}"
          fi
          node -e "const {execFileSync}=require('node:child_process'); const id=process.env.DATABASE_CONTAINER_ID||''; if(!/^[a-f0-9]{12,64}$/.test(id))throw new Error('unsafe database container identity'); const rows=JSON.parse(execFileSync('docker',['inspect',id],{encoding:'utf8',timeout:30000})); if(rows.length!==1||!rows[0].State.Running||rows[0].State.Health?.Status!=='healthy')throw new Error('selected soak database is not healthy after cleanup');"
      - name: Record bounded workflow failure
        if: ${{ always() && job.status != 'success' }}
        env:
          PROFILE: ${{ matrix.profile }}
          INVOCATION_OUTCOME: ${{ steps.invocation.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          CONTRACTS_OUTCOME: ${{ steps.contracts.outcome }}
          MIGRATION_OUTCOME: ${{ steps.migration.outcome }}
          SOAK_OUTCOME: ${{ steps.soak.outcome }}
          RECOVERY_OUTCOME: ${{ steps.recovery.outcome }}
        run: |
          node -e "const fs=require('node:fs'),crypto=require('node:crypto'),path=require('node:path'); const names=['invocation','checkout','setup','install','contracts','migration','soak','recovery']; const outcomes=Object.fromEntries(names.map(name=>[name,process.env[name.toUpperCase()+'_OUTCOME']||'skipped'])); const phase=names.find(name=>['failure','cancelled'].includes(outcomes[name]))||'workflow'; const payload={schemaVersion:'tixkit-performance-soak-workflow-failure-v1',status:'failed',claimScope:'trusted-single-host-continuous-integration-soak',profile:process.env.PROFILE,runnerLabel:'tixkit-epyc-trusted',gitSha:process.env.GITHUB_SHA,phase,outcomes,failedAt:new Date().toISOString(),integrityModel:'checksums-not-signatures'}; const canonical=v=>Array.isArray(v)?v.map(canonical):v&&typeof v==='object'?Object.fromEntries(Object.keys(v).sort().map(k=>[k,canonical(v[k])])):v; const failure={...payload,failureSha256:crypto.createHash('sha256').update(JSON.stringify(canonical(payload))).digest('hex')}; fs.writeFileSync(path.join(process.env.FAILURE_ROOT,'workflow-failure.json'),JSON.stringify(failure,null,2)+'\n',{flag:'wx',mode:0o600});"
      - name: Upload successful soak evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: soak-${{ matrix.profile }}
          path: ${{ env.EVIDENCE_ROOT }}
          if-no-files-found: error
          retention-days: 90
      - name: Upload failure evidence
        if: ${{ always() && job.status != 'success' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: soak-failure-${{ matrix.profile }}
          path: |
            ${{ env.FAILURE_ROOT }}
            ${{ env.EVIDENCE_ROOT }}
          if-no-files-found: error
          retention-days: 90
