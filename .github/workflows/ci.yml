name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-js
      - run: bun install --frozen-lockfile
      - run: bun run audit
      - run: bun run format:check
      - run: bun run lint
      - run: npx turbo run typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-js
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build

  oss-export:
    name: OSS Export
    runs-on: ubuntu-latest
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-js
      - run: bun install --frozen-lockfile
      - name: Generate sanitized public export
        run: bun run export:oss -- --out /tmp/tixkit-oss-export
      - name: Validate exported tree
        working-directory: /tmp/tixkit-oss-export
        run: |
          bun install --frozen-lockfile
          bun run format:check
          bun run lint
          bun run typecheck
          bunx turbo run build --filter=@tixkit/db --filter=@tixkit/shared
          env -u DATABASE_URL -u DATABASE_URL_MYSQL bun run test:unit
          bun run build
          git init -q
          git add .
          git diff --cached --check

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-js
      - run: bun install --frozen-lockfile
      - run: bun run test:unit

  flutter-sdk:
    name: Flutter SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: stable
          cache: true
      - name: Install package dependencies
        run: cd packages/sdk-flutter && flutter pub get
      - name: Analyze package
        run: cd packages/sdk-flutter && flutter analyze
      - name: Run package tests
        run: cd packages/sdk-flutter && flutter test
      - name: Install example dependencies
        run: cd packages/sdk-flutter/example && flutter pub get
      - name: Build example app
        run: cd packages/sdk-flutter/example && flutter build web --release
      - name: Install demo dependencies
        run: cd apps/sdk-flutter-demo && flutter pub get
      - name: Analyze demo
        run: cd apps/sdk-flutter-demo && flutter analyze
      - name: Run demo tests
        run: cd apps/sdk-flutter-demo && flutter test
      - name: Build demo app
        run: cd apps/sdk-flutter-demo && flutter build web --release

  ios-sdk:
    name: iOS SDK
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Swift package
        run: cd packages/sdk-ios && swift build
      - name: Run Swift package tests
        run: cd packages/sdk-ios && swift test
      - name: Build example app
        run: cd packages/sdk-ios/Examples/TixkitIOSExample && swift build
      - name: Run example scanner smoke
        run: cd packages/sdk-ios/Examples/TixkitIOSExample && swift run TixkitIOSExample

  android-sdk:
    name: Android SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test Android SDK
        run: cd packages/sdk-android && ./gradlew build test
      - name: Run example scanner smoke
        run: cd packages/sdk-android && ./gradlew :example:testDebugUnitTest

  react-native-demo:
    name: React Native Demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-js
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build RN SDK
        run: bunx turbo run build --filter @tixkit/react-native
      - name: Typecheck demo
        run: cd apps/sdk-react-native-demo && bun run typecheck
      - name: Lint demo
        run: cd apps/sdk-react-native-demo && bun run lint

  integration-tests-postgres:
    name: Integration Tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tixkit
          POSTGRES_PASSWORD: tixkit
          POSTGRES_DB: tixkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tixkit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      temporal:
        image: temporalio/auto-setup:1.24
        ports:
          - 7233:7233
        env:
          DB: postgres12
          DB_PORT: 5432
          POSTGRES_SEEDS: postgres
          POSTGRES_USER: tixkit
          POSTGRES_PWD: tixkit
    env:
      DATABASE_URL: postgres://tixkit:tixkit@localhost:5432/tixkit
      REDIS_URL: redis://localhost:6379
      TEMPORAL_ADDRESS: localhost:7233
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-js
      - run: bun install --frozen-lockfile
      - name: Wait for Temporal
        run: |
          for i in $(seq 1 60); do
            if nc -z localhost 7233 2>/dev/null; then
              echo "Temporal ready"
              exit 0
            fi
            echo "Waiting for Temporal... ($i)"; sleep 5
          done
          echo "Temporal did not become ready" >&2
          exit 1
      - run: bun run db:migrate
      - run: bunx turbo run build --filter=@tixkit/db --filter=@tixkit/shared
      - run: bun run test:integration

  integration-tests-mysql:
    name: Integration Tests (MySQL)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: tixkit
          MYSQL_DATABASE: tixkit
          MYSQL_USER: tixkit
          MYSQL_PASSWORD: tixkit
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u tixkit -ptixkit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      temporal:
        image: temporalio/auto-setup:1.24
        ports:
          - 7233:7233
        env:
          DB: mysql8
          DB_PORT: 3306
          MYSQL_SEEDS: mysql
          MYSQL_USER: root
          MYSQL_PWD: tixkit
    env:
      DATABASE_URL_MYSQL: mysql://tixkit:tixkit@localhost:3306/tixkit
      REDIS_URL: redis://localhost:6379
      TEMPORAL_ADDRESS: localhost:7233
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-js
      - run: bun install --frozen-lockfile
      - name: Wait for Temporal
        run: |
          for i in $(seq 1 60); do
            if nc -z localhost 7233 2>/dev/null; then
              echo "Temporal ready"
              exit 0
            fi
            echo "Waiting for Temporal... ($i)"; sleep 5
          done
          echo "Temporal did not become ready" >&2
          exit 1
      - run: bun run db:migrate:mysql
      - run: bunx turbo run build --filter=@tixkit/db --filter=@tixkit/shared
      - name: MySQL Tier 1 correctness suites
        run: |
          cd packages/api
          DB_INTEGRATION_DRIVER=mysql bun vitest run src/__tests__/integration/inventory-concurrency.integration.test.ts src/__tests__/integration/load-harness.integration.test.ts
          cd ../..
          DB_INTEGRATION_DRIVER=mysql bun --filter @tixkit/workflows test:mysql-tier1
      - run: DB_INTEGRATION_DRIVER=mysql bun run test:integration:serial

  integration-tests-mssql:
    name: Integration Tests (MSSQL, gated)
    runs-on: ubuntu-latest
    if: ${{ vars.RUN_MSSQL_TESTS == '1' }}
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'Test-password-12345'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Test-password-12345 -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_DRIVER: mssql
      DATABASE_URL_MSSQL: sqlserver://sa:Test-password-12345@localhost:1433/tixkit?trustServerCertificate=true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-js
      - run: bun install --frozen-lockfile
      - name: Create MSSQL database
        run: docker exec "${{ job.services.mssql.id }}" /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Test-password-12345 -C -Q "IF DB_ID('tixkit') IS NULL CREATE DATABASE tixkit"
      - run: bun run --filter @tixkit/db test:mssql

  e2e-browser-matrix:
    name: E2E Browser Matrix (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs:
      - build
      - unit-tests
      - integration-tests-postgres
      - integration-tests-mysql
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      CI: 'true'
      ADMIN_DASHBOARD_URL: http://localhost:3202
      CHECKOUT_URL: http://localhost:3201
      TIXKIT_API_URL: http://localhost:4200
      TEMPORAL_TASK_QUEUE: tixkit-e2e-${{ matrix.browser }}
      DATABASE_URL: postgres://tixkit:tixkit@localhost:5432/tixkit
      DATABASE_URL_MYSQL: mysql://tixkit:tixkit@localhost:3306/tixkit
      REDIS_URL: redis://localhost:6379
      TEMPORAL_ADDRESS: localhost:7233
      TEMPORAL_NAMESPACE: default
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: tixkit
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_REGION: us-east-1
      QR_SIGNING_SECRET: ci-qr-signing-secret
      OFFLINE_MANIFEST_SIGNING_KEY: ci-offline-manifest-signing-key
      OFFLINE_MANIFEST_KEY_ID: manifest:ci
      CLERK_SECRET_KEY: ''
      CLERK_PUBLISHABLE_KEY: ''
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ''
      CLERK_WEBHOOK_SECRET: ''
      STRIPE_SECRET_KEY: ''
      STRIPE_WEBHOOK_SECRET: ''
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ''
      OTEL_SDK_DISABLED: 'true'
      RATE_LIMIT_MAX: '100000'
      RATE_LIMIT_TIME_WINDOW: 1 minute
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-js
        with:
          playwright-cache: 'true'
      - run: bun install --frozen-lockfile
      - name: Install Playwright browsers
        run: bunx playwright install --with-deps ${{ matrix.browser }}
      - name: Write CI env file
        run: |
          cat > .env.local <<EOF
          NODE_ENV=development
          PORT=4000
          LOG_LEVEL=info
          OTEL_SDK_DISABLED=true
          API_BASE_URL=http://localhost:4000
          NEXT_PUBLIC_TIXKIT_API_BASE_URL=http://localhost:4000/v1
          NEXT_PUBLIC_ADMIN_API_BASE_URL=http://localhost:4000
          DATABASE_URL=postgres://tixkit:tixkit@localhost:5432/tixkit
          DATABASE_URL_MYSQL=mysql://tixkit:tixkit@localhost:3306/tixkit
          REDIS_URL=redis://localhost:6379
          QR_SIGNING_SECRET=ci-qr-signing-secret
          OFFLINE_MANIFEST_SIGNING_KEY=ci-offline-manifest-signing-key
          OFFLINE_MANIFEST_KEY_ID=manifest:ci
          TEMPORAL_ADDRESS=localhost:7233
          TEMPORAL_NAMESPACE=default
          TEMPORAL_TASK_QUEUE=tixkit-e2e-${{ matrix.browser }}
          CLERK_SECRET_KEY=
          CLERK_PUBLISHABLE_KEY=
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=
          CLERK_WEBHOOK_SECRET=
          STRIPE_SECRET_KEY=
          STRIPE_WEBHOOK_SECRET=
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=
          TELNYX_API_KEY=
          TELNYX_WEBHOOK_PUBLIC_KEY=
          S3_ENDPOINT=http://localhost:9000
          S3_BUCKET=tixkit
          S3_ACCESS_KEY_ID=minioadmin
          S3_SECRET_ACCESS_KEY=minioadmin
          S3_REGION=us-east-1
          EOF
      - name: Start Docker-backed services
        run: docker compose -f infra/docker-compose.yml up -d --wait postgres mysql redis temporal temporal-postgresql minio
      - name: Wait for Temporal
        run: |
          for attempt in {1..90}; do
            if bash -c "echo > /dev/tcp/localhost/7233" 2>/dev/null; then
              echo "Temporal port open after $attempt attempts"
              sleep 3
              exit 0
            fi
            sleep 2
          done
          docker compose -f infra/docker-compose.yml logs temporal
          exit 1
      - name: Run database migrations
        run: |
          bun run --env-file=.env.local db:migrate
          bun run --env-file=.env.local db:migrate:mysql
      - name: Build widget bundle
        run: bun run --filter @tixkit/widget build
      - name: Build service dependencies
        run: bunx turbo run build --filter=@tixkit/db --filter=@tixkit/shared --filter=@tixkit/domain --filter=@tixkit/workflows
      - name: Run Playwright ${{ matrix.browser }}
        run: bun run test:e2e -- --project=${{ matrix.browser }}
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.browser }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload Playwright screenshots and axe attachments
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Show Docker logs on failure
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --no-color
      - name: Stop Docker-backed services
        if: always()
        run: docker compose -f infra/docker-compose.yml down -v

  provider-tests-stripe:
    name: Provider Tests (Stripe)
    runs-on: ubuntu-latest
    needs:
      - build
      - unit-tests
      - integration-tests-postgres
    timeout-minutes: 45
    env:
      CI: 'true'
      ADMIN_DASHBOARD_URL: http://localhost:3202
      CHECKOUT_URL: http://localhost:3201
      TIXKIT_API_URL: http://localhost:4200
      TEMPORAL_TASK_QUEUE: tixkit-provider-ci
      DATABASE_URL: postgres://tixkit:tixkit@localhost:5432/tixkit
      REDIS_URL: redis://localhost:6379
      TEMPORAL_ADDRESS: localhost:7233
      TEMPORAL_NAMESPACE: default
      QR_SIGNING_SECRET: ci-qr-signing-secret
      OFFLINE_MANIFEST_SIGNING_KEY: ci-offline-manifest-signing-key
      OFFLINE_MANIFEST_KEY_ID: manifest:ci
      CLERK_SECRET_KEY: ''
      CLERK_PUBLISHABLE_KEY: ''
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ''
      CLERK_WEBHOOK_SECRET: ''
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      STRIPE_CONNECT_CLIENT_ID: ${{ secrets.STRIPE_CONNECT_CLIENT_ID }}
      OTEL_SDK_DISABLED: 'true'
      RATE_LIMIT_MAX: '100000'
      RATE_LIMIT_TIME_WINDOW: 1 minute
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-js
        with:
          playwright-cache: 'true'
      - name: Detect provider secrets
        id: provider-secrets
        run: |
          missing=()
          for name in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY STRIPE_CONNECT_CLIENT_ID; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            {
              echo "### Stripe provider tests skipped"
              echo
              echo "Missing CI-managed test-mode secrets: ${missing[*]}"
              echo
              echo "This is expected for forked pull requests. Configure all listed secrets to run direct Stripe, hosted Stripe Elements, and Stripe Connect provider gates."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - run: bun install --frozen-lockfile
        if: steps.provider-secrets.outputs.available == 'true'
      - name: Install Chromium
        if: steps.provider-secrets.outputs.available == 'true'
        run: bunx playwright install --with-deps chromium
      - name: Write provider CI env file
        if: steps.provider-secrets.outputs.available == 'true'
        run: |
          cat > .env.local <<EOF
          NODE_ENV=development
          PORT=4000
          LOG_LEVEL=info
          OTEL_SDK_DISABLED=true
          API_BASE_URL=http://localhost:4000
          NEXT_PUBLIC_TIXKIT_API_BASE_URL=http://localhost:4000/v1
          NEXT_PUBLIC_ADMIN_API_BASE_URL=http://localhost:4000
          DATABASE_URL=postgres://tixkit:tixkit@localhost:5432/tixkit
          REDIS_URL=redis://localhost:6379
          QR_SIGNING_SECRET=ci-qr-signing-secret
          OFFLINE_MANIFEST_SIGNING_KEY=ci-offline-manifest-signing-key
          OFFLINE_MANIFEST_KEY_ID=manifest:ci
          TEMPORAL_ADDRESS=localhost:7233
          TEMPORAL_NAMESPACE=default
          TEMPORAL_TASK_QUEUE=tixkit-provider-ci
          CLERK_SECRET_KEY=
          CLERK_PUBLISHABLE_KEY=
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=
          CLERK_WEBHOOK_SECRET=
          STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
          STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
          STRIPE_CONNECT_CLIENT_ID=${STRIPE_CONNECT_CLIENT_ID}
          EOF
      - name: Start Docker-backed services
        if: steps.provider-secrets.outputs.available == 'true'
        run: docker compose -f infra/docker-compose.yml up -d --wait postgres redis temporal temporal-postgresql
      - name: Wait for Temporal
        if: steps.provider-secrets.outputs.available == 'true'
        run: |
          for attempt in {1..90}; do
            if bash -c "echo > /dev/tcp/localhost/7233" 2>/dev/null; then
              echo "Temporal port open after $attempt attempts"
              sleep 3
              exit 0
            fi
            sleep 2
          done
          docker compose -f infra/docker-compose.yml logs temporal
          exit 1
      - name: Run database migrations
        if: steps.provider-secrets.outputs.available == 'true'
        run: bun run --env-file=.env.local db:migrate
      - name: Build dependencies
        if: steps.provider-secrets.outputs.available == 'true'
        run: bunx turbo run build --filter=@tixkit/db --filter=@tixkit/shared
      - name: Run direct Stripe provider workflow test
        if: steps.provider-secrets.outputs.available == 'true'
        run: RUN_STRIPE_PROVIDER_TESTS=1 bun run --env-file=.env.local --filter @tixkit/workflows test:provider:stripe
      - name: Run hosted Stripe Elements browser test
        if: steps.provider-secrets.outputs.available == 'true'
        run: bun run --env-file=.env.local test:e2e:stripe-provider
      - name: Run Stripe Connect provider test
        if: steps.provider-secrets.outputs.available == 'true'
        run: cd packages/api && RUN_STRIPE_CONNECT_TESTS=1 bun --env-file=../../.env.local vitest run src/__tests__/integration/stripe-connect-provider.integration.test.ts
      - name: Record provider success
        if: steps.provider-secrets.outputs.available == 'true'
        run: |
          {
            echo "### Stripe provider tests passed"
            echo
            echo "- Direct Stripe create/confirm/refund activity validation ran."
            echo "- Hosted Stripe Elements checkout/refund browser validation ran."
            echo "- Stripe Connect account creation/status refresh validation ran."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload provider Playwright report
        if: always() && steps.provider-secrets.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-stripe-provider
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload provider Playwright artifacts
        if: always() && steps.provider-secrets.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-stripe-provider
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Show Docker logs on failure
        if: failure() && steps.provider-secrets.outputs.available == 'true'
        run: docker compose -f infra/docker-compose.yml logs --no-color
      - name: Stop Docker-backed services
        if: always() && steps.provider-secrets.outputs.available == 'true'
        run: docker compose -f infra/docker-compose.yml down -v
