name: Trusted Host Capacity Characterization

on:
  schedule:
    - cron: '41 6 * * 0'
  workflow_dispatch:
    inputs:
      profile:
        description: Trusted-host database profile
        required: true
        default: both
        type: choice
        options:
          - both
          - postgresql-trusted-host
          - mysql-trusted-host

concurrency:
  group: performance-capacity
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  characterize:
    name: ${{ matrix.profile }}
    runs-on: tixkit-epyc-trusted
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        profile: ${{ fromJSON(inputs.profile == 'postgresql-trusted-host' && '["postgresql-trusted-host"]' || inputs.profile == 'mysql-trusted-host' && '["mysql-trusted-host"]' || '["postgresql-trusted-host","mysql-trusted-host"]') }}
    services:
      database:
        image: ${{ matrix.profile == 'postgresql-trusted-host' && 'postgres:16-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb' || 'mysql:8.4@sha256:d36d39a64cd12a5c1cc9e6aa2bfb5f8d4c81a2f6586e0a04a9ae13939db02209' }}
        env:
          POSTGRES_USER: tixkit
          POSTGRES_PASSWORD: tixkit
          POSTGRES_DB: tixkit
          MYSQL_ROOT_PASSWORD: tixkit
          MYSQL_DATABASE: tixkit
          MYSQL_USER: tixkit
          MYSQL_PASSWORD: tixkit
        ports:
          - ${{ matrix.profile == 'postgresql-trusted-host' && '5432:5432' || '3306:3306' }}
        options: >-
          --health-cmd "${{ matrix.profile == 'postgresql-trusted-host' && 'pg_isready -U tixkit' || 'mysqladmin ping -h localhost -u tixkit -ptixkit' }}"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://tixkit:tixkit@localhost:5432/tixkit
      DATABASE_URL_MYSQL: mysql://tixkit:tixkit@localhost:3306/tixkit
    steps:
      - name: Create private exclusive evidence root
        id: evidence-root
        run: |
          set -euo pipefail
          evidence_root="${RUNNER_TEMP}/tixkit-capacity-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.profile }}"
          mkdir -m 700 "${evidence_root}"
          echo "EVIDENCE_ROOT=${evidence_root}" >> "${GITHUB_ENV}"
      - name: Reject non-default or untrusted invocation
        id: invocation
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EXPECTED_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          case "${GITHUB_EVENT_NAME}" in
            schedule|workflow_dispatch) ;;
            *) echo 'Capacity characterization accepts only schedule or workflow_dispatch.' >&2; exit 1 ;;
          esac
          if [ "${GITHUB_REF_TYPE}" != branch ] || [ "${GITHUB_REF}" != "${EXPECTED_REF}" ] || [ "${GITHUB_REF_NAME}" != "${DEFAULT_BRANCH}" ]; then
            echo 'Capacity characterization must run from the default branch.' >&2
            exit 1
          fi
      - id: checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - id: setup
        uses: ./.github/actions/setup-js
      - id: install
        run: bun install --frozen-lockfile
      - name: Validate capacity contracts
        id: contracts
        run: node --test scripts/__tests__/performance-capacity.test.mjs
      - name: Prepare pinned databases
        id: migration
        run: |
          set -euo pipefail
          if [ "${{ matrix.profile }}" = postgresql-trusted-host ]; then
            bun run db:migrate
          else
            bun run db:migrate:mysql
          fi
          bunx turbo run build --filter=@tixkit/db --filter=@tixkit/shared --filter=@tixkit/domain
      - name: Run bounded trusted-host capacity characterization
        id: capacity
        run: |
          set -euo pipefail
          node scripts/performance-capacity.mjs \
            --config performance-capacity.trusted.json \
            --profile "${{ matrix.profile }}" \
            --output "${EVIDENCE_ROOT}/characterization" \
            --git-sha "${GITHUB_SHA}"
      - name: Record bounded workflow failure
        if: ${{ always() && job.status != 'success' }}
        env:
          JOB_STATUS: ${{ job.status }}
          PROFILE: ${{ matrix.profile }}
          DATABASE_IMAGE: ${{ matrix.profile == 'postgresql-trusted-host' && 'postgres:16-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb' || 'mysql:8.4@sha256:d36d39a64cd12a5c1cc9e6aa2bfb5f8d4c81a2f6586e0a04a9ae13939db02209' }}
          INVOCATION_OUTCOME: ${{ steps.invocation.outcome }}
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          CONTRACTS_OUTCOME: ${{ steps.contracts.outcome }}
          MIGRATION_OUTCOME: ${{ steps.migration.outcome }}
          CAPACITY_OUTCOME: ${{ steps.capacity.outcome }}
        run: |
          node -e "const fs=require('node:fs'),path=require('node:path'),crypto=require('node:crypto'); const names=['invocation','checkout','setup','install','contracts','migration','capacity']; const outcomes=Object.fromEntries(names.map(name=>[name,process.env[name.toUpperCase()+'_OUTCOME']||'skipped'])); const phase=names.find(name=>['failure','cancelled'].includes(outcomes[name]))||'workflow'; const configPath=path.join(process.env.GITHUB_WORKSPACE||process.cwd(),'performance-capacity.trusted.json'); const configSha256=outcomes.checkout==='success'&&fs.existsSync(configPath)?crypto.createHash('sha256').update(fs.readFileSync(configPath)).digest('hex'):null; const payload={schemaVersion:'tixkit-performance-capacity-failure-v1',status:'failed',phase,outcomes,profile:process.env.PROFILE,runnerLabel:'tixkit-epyc-trusted',databaseImage:process.env.DATABASE_IMAGE,configSha256,gitSha:process.env.GITHUB_SHA,failedAt:new Date().toISOString(),error:('workflow '+process.env.JOB_STATUS).slice(0,200),integrityModel:'checksums-not-signatures'}; const canonical=v=>Array.isArray(v)?v.map(canonical):v&&typeof v==='object'?Object.fromEntries(Object.keys(v).sort().map(k=>[k,canonical(v[k])])):v; const artifact={...payload,failureSha256:crypto.createHash('sha256').update(JSON.stringify(canonical(payload))).digest('hex')}; fs.writeFileSync(path.join(process.env.EVIDENCE_ROOT,'workflow-failure.json'),JSON.stringify(artifact,null,2)+'\n',{flag:'wx',mode:0o600});"
      - name: Upload complete or failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: capacity-${{ matrix.profile }}
          path: ${{ env.EVIDENCE_ROOT }}
          if-no-files-found: error
          retention-days: 90
