name: Trusted CI

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

concurrency:
  group: trusted-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: tixkit-epyc-trusted
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-js
      - run: bun install --frozen-lockfile
      - run: bun run audit
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck

  build:
    name: Build
    runs-on: tixkit-epyc-trusted
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-js
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build

  oss-export:
    name: OSS Export
    runs-on: tixkit-epyc-trusted
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-js
      - run: bun install --frozen-lockfile
      - name: Generate sanitized public export
        run: bun run export:oss -- --out /tmp/tixkit-oss-export
      - name: Validate exported tree
        working-directory: /tmp/tixkit-oss-export
        run: |
          bun install --frozen-lockfile
          bun run format:check
          bun run lint
          bun run typecheck
          bunx turbo run build --filter=@tixkit/db --filter=@tixkit/shared
          env -u DATABASE_URL -u DATABASE_URL_MYSQL bun run test:unit
          bun run build
          git init -q
          git add .
          git diff --cached --check

  unit-tests:
    name: Unit Tests
    runs-on: tixkit-epyc-trusted
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-js
      - run: bun install --frozen-lockfile
      - run: bun run test:unit

  flutter-sdk:
    name: Flutter SDK
    runs-on: tixkit-epyc-trusted
    if: ${{ vars.RUN_TRUSTED_FLUTTER_SDK == '1' }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Flutter archive tools
        run: |
          if command -v xz >/dev/null 2>&1; then
            exit 0
          fi
          apt_get='apt-get'
          if command -v sudo >/dev/null 2>&1; then
            apt_get='sudo apt-get'
          fi
          ${apt_get} update
          ${apt_get} install -y xz-utils
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: stable
          cache: true
      - name: Install package dependencies
        run: cd packages/sdk-flutter && flutter pub get
      - name: Analyze package
        run: cd packages/sdk-flutter && flutter analyze
      - name: Run package tests
        run: cd packages/sdk-flutter && flutter test
      - name: Install example dependencies
        run: cd packages/sdk-flutter/example && flutter pub get
      - name: Build example app
        run: cd packages/sdk-flutter/example && flutter build web --release
      - name: Install demo dependencies
        run: cd apps/sdk-flutter-demo && flutter pub get
      - name: Analyze demo
        run: cd apps/sdk-flutter-demo && flutter analyze
      - name: Run demo tests
        run: cd apps/sdk-flutter-demo && flutter test
      - name: Build demo app
        run: cd apps/sdk-flutter-demo && flutter build web --release

  ios-sdk:
    name: iOS SDK
    runs-on: macos-latest
    if: ${{ vars.RUN_TRUSTED_IOS_SDK == '1' }}
    steps:
      - uses: actions/checkout@v7
      - name: Build Swift package
        run: cd packages/sdk-ios && swift build
      - name: Run Swift package tests
        run: cd packages/sdk-ios && swift test
      - name: Build example app
        run: cd packages/sdk-ios/Examples/TixkitIOSExample && swift build
      - name: Run example scanner smoke
        run: cd packages/sdk-ios/Examples/TixkitIOSExample && swift run TixkitIOSExample

  android-sdk:
    name: Android SDK
    runs-on: tixkit-epyc-trusted
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v6
      - name: Build and test Android SDK
        run: cd packages/sdk-android && ./gradlew build test
      - name: Run example scanner smoke
        run: cd packages/sdk-android && ./gradlew :example:testDebugUnitTest

  react-native-demo:
    name: React Native Demo
    runs-on: tixkit-epyc-trusted
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-js
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build RN SDK
        run: bunx turbo run build --filter @tixkit/react-native
      - name: Typecheck demo
        run: cd apps/sdk-react-native-demo && bun run typecheck
      - name: Lint demo
        run: cd apps/sdk-react-native-demo && bun run lint

  integration-tests-postgres:
    name: Integration Tests (PostgreSQL)
    runs-on: tixkit-epyc-trusted
    if: ${{ vars.RUN_TRUSTED_DB_INTEGRATION == '1' }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tixkit
          POSTGRES_PASSWORD: tixkit
          POSTGRES_DB: tixkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tixkit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      temporal:
        image: temporalio/auto-setup:1.24
        ports:
          - 7233:7233
        env:
          DB: postgres12
          DB_PORT: 5432
          POSTGRES_SEEDS: postgres
          POSTGRES_USER: tixkit
          POSTGRES_PWD: tixkit
    env:
      DATABASE_URL: postgres://tixkit:tixkit@localhost:5432/tixkit
      REDIS_URL: redis://localhost:6379
      TEMPORAL_ADDRESS: localhost:7233
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-js
      - run: bun install --frozen-lockfile
      - name: Wait for Temporal
        run: |
          for i in $(seq 1 60); do
            if nc -z localhost 7233 2>/dev/null; then
              echo "Temporal ready"
              exit 0
            fi
            echo "Waiting for Temporal... ($i)"; sleep 5
          done
          echo "Temporal did not become ready" >&2
          exit 1
      - run: bun run db:migrate
      - run: bunx turbo run build --filter=@tixkit/db --filter=@tixkit/shared
      - run: bun run test:integration

  integration-tests-mysql:
    name: Integration Tests (MySQL)
    runs-on: tixkit-epyc-trusted
    if: ${{ vars.RUN_TRUSTED_DB_INTEGRATION == '1' }}
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: tixkit
          MYSQL_DATABASE: tixkit
          MYSQL_USER: tixkit
          MYSQL_PASSWORD: tixkit
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u tixkit -ptixkit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      temporal:
        image: temporalio/auto-setup:1.24
        ports:
          - 7233:7233
        env:
          DB: mysql8
          DB_PORT: 3306
          MYSQL_SEEDS: mysql
          MYSQL_USER: root
          MYSQL_PWD: tixkit
    env:
      DATABASE_URL_MYSQL: mysql://tixkit:tixkit@localhost:3306/tixkit
      REDIS_URL: redis://localhost:6379
      TEMPORAL_ADDRESS: localhost:7233
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-js
      - run: bun install --frozen-lockfile
      - name: Wait for Temporal
        run: |
          for i in $(seq 1 60); do
            if nc -z localhost 7233 2>/dev/null; then
              echo "Temporal ready"
              exit 0
            fi
            echo "Waiting for Temporal... ($i)"; sleep 5
          done
          echo "Temporal did not become ready" >&2
          exit 1
      - run: bun run db:migrate:mysql
      - run: bunx turbo run build --filter=@tixkit/db --filter=@tixkit/shared
      - name: MySQL Tier 1 correctness suites
        run: |
          cd packages/api
          DB_INTEGRATION_DRIVER=mysql bun vitest run src/__tests__/integration/inventory-concurrency.integration.test.ts src/__tests__/integration/load-harness.integration.test.ts
          cd ../..
          DB_INTEGRATION_DRIVER=mysql bun --filter @tixkit/workflows test:mysql-tier1
