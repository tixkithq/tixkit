name: Trusted CI

on:
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

concurrency:
  group: trusted-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: tixkit-epyc-trusted
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Verify GitHub Action refs are pinned
        run: infra/ci/scripts/verify-github-action-pins.sh
      - uses: ./.github/actions/setup-js
      - run: bun install --frozen-lockfile
      - run: bun run audit
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck

  build:
    name: Build
    runs-on: tixkit-epyc-trusted
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: ./.github/actions/setup-js
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build
      - run: bun run check:performance-budgets

  oss-export:
    name: OSS Export
    runs-on: tixkit-epyc-trusted
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: ./.github/actions/setup-js
      - run: bun install --frozen-lockfile
      - name: Generate sanitized public export
        run: bun run export:oss -- --out /tmp/tixkit-oss-export
      - name: Validate exported tree
        working-directory: /tmp/tixkit-oss-export
        run: |
          bun install --frozen-lockfile
          bun run format:check
          bun run lint
          bun run typecheck
          bunx turbo run build --filter=@tixkit/db --filter=@tixkit/shared
          env -u DATABASE_URL -u DATABASE_URL_MYSQL bun run test:unit
          bun run build
          git init -q
          git add .
          git diff --cached --check

  unit-tests:
    name: Unit Tests
    runs-on: tixkit-epyc-trusted
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: ./.github/actions/setup-js
      - run: bun install --frozen-lockfile
      - run: bun run test:unit

  flutter-sdk:
    name: Flutter SDK
    runs-on: tixkit-epyc-trusted
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Verify Flutter runner prerequisites
        run: |
          xz --version
          unzip -v | head -n 2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.22.x'
          channel: stable
          cache: true
      - name: Install package dependencies
        run: cd packages/sdk-flutter && flutter pub get
      - name: Analyze package
        run: cd packages/sdk-flutter && flutter analyze
      - name: Run package tests
        run: cd packages/sdk-flutter && flutter test
      - name: Install example dependencies
        run: cd packages/sdk-flutter/example && flutter pub get
      - name: Build example app
        run: cd packages/sdk-flutter/example && flutter build web --release
      - name: Install demo dependencies
        run: cd apps/sdk-flutter-demo && flutter pub get
      - name: Analyze demo
        run: cd apps/sdk-flutter-demo && flutter analyze
      - name: Run demo tests
        run: cd apps/sdk-flutter-demo && flutter test
      - name: Build demo app
        run: cd apps/sdk-flutter-demo && flutter build web --release

  ios-sdk:
    name: iOS SDK
    runs-on: macos-latest
    if: ${{ vars.RUN_TRUSTED_IOS_SDK == '1' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Build Swift package
        run: cd packages/sdk-ios && swift build
      - name: Run Swift package tests
        run: cd packages/sdk-ios && swift test
      - name: Build example app
        run: cd packages/sdk-ios/Examples/TixkitIOSExample && swift build
      - name: Run example scanner smoke
        run: cd packages/sdk-ios/Examples/TixkitIOSExample && swift run TixkitIOSExample

  android-sdk:
    name: Android SDK
    runs-on: tixkit-epyc-trusted
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
      - uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3 # v6
      - name: Build and test Android SDK
        run: cd packages/sdk-android && ./gradlew build test
      - name: Run example scanner smoke
        run: cd packages/sdk-android && ./gradlew :example:testDebugUnitTest

  react-native-demo:
    name: React Native Demo
    runs-on: tixkit-epyc-trusted
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: ./.github/actions/setup-js
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build RN SDK
        run: bunx turbo run build --filter @tixkit/react-native
      - name: Typecheck demo
        run: cd apps/sdk-react-native-demo && bun run typecheck
      - name: Lint demo
        run: cd apps/sdk-react-native-demo && bun run lint

  integration-tests-postgres:
    name: Integration Tests (PostgreSQL)
    runs-on: tixkit-epyc-trusted
    services:
      postgres:
        image: postgres:16-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
        env:
          POSTGRES_USER: tixkit
          POSTGRES_PASSWORD: tixkit
          POSTGRES_DB: tixkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tixkit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      temporal:
        image: temporalio/auto-setup:1.24@sha256:98cdb6b5e02d64cb933864a9ba91cb66065eb320623a0dafdf44beba535bca88
        ports:
          - 7233:7233
        env:
          DB: postgres12
          DB_PORT: 5432
          POSTGRES_SEEDS: postgres
          POSTGRES_USER: tixkit
          POSTGRES_PWD: tixkit
    env:
      DATABASE_URL: postgres://tixkit:tixkit@localhost:5432/tixkit
      REDIS_URL: redis://localhost:6379
      TEMPORAL_ADDRESS: localhost:7233
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: ./.github/actions/setup-js
      - run: bun install --frozen-lockfile
      - name: Wait for Temporal
        run: |
          for i in $(seq 1 60); do
            if timeout 2 bash -c '</dev/tcp/127.0.0.1/7233' 2>/dev/null; then
              echo "Temporal ready"
              exit 0
            fi
            echo "Waiting for Temporal... ($i)"; sleep 5
          done
          echo "Temporal did not become ready" >&2
          exit 1
      - run: bun run db:migrate
      - run: bunx turbo run build --filter=@tixkit/db --filter=@tixkit/shared
      - run: bun run test:integration

  integration-tests-mysql:
    name: Integration Tests (MySQL)
    runs-on: tixkit-epyc-trusted
    services:
      mysql:
        image: mysql:8.4@sha256:d36d39a64cd12a5c1cc9e6aa2bfb5f8d4c81a2f6586e0a04a9ae13939db02209
        env:
          MYSQL_ROOT_PASSWORD: tixkit
          MYSQL_DATABASE: tixkit
          MYSQL_USER: tixkit
          MYSQL_PASSWORD: tixkit
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u tixkit -ptixkit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      temporal:
        image: temporalio/auto-setup:1.24@sha256:98cdb6b5e02d64cb933864a9ba91cb66065eb320623a0dafdf44beba535bca88
        ports:
          - 7233:7233
        env:
          DB: mysql8
          DB_PORT: 3306
          MYSQL_SEEDS: mysql
          MYSQL_USER: root
          MYSQL_PWD: tixkit
    env:
      DATABASE_URL_MYSQL: mysql://tixkit:tixkit@localhost:3306/tixkit
      REDIS_URL: redis://localhost:6379
      TEMPORAL_ADDRESS: localhost:7233
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: ./.github/actions/setup-js
      - run: bun install --frozen-lockfile
      - name: Wait for Temporal
        run: |
          for i in $(seq 1 60); do
            if timeout 2 bash -c '</dev/tcp/127.0.0.1/7233' 2>/dev/null; then
              echo "Temporal ready"
              exit 0
            fi
            echo "Waiting for Temporal... ($i)"; sleep 5
          done
          echo "Temporal did not become ready" >&2
          exit 1
      - run: bun run db:migrate:mysql
      - run: bunx turbo run build --filter=@tixkit/db --filter=@tixkit/shared
      - name: MySQL Tier 1 correctness suites
        run: |
          cd packages/api
          DB_INTEGRATION_DRIVER=mysql PERFORMANCE_METRICS_PATH=../../artifacts/performance/load-harness-metrics.json bun vitest run src/__tests__/integration/inventory-concurrency.integration.test.ts src/__tests__/integration/load-harness.integration.test.ts
          cd ../..
          DB_INTEGRATION_DRIVER=mysql bun --filter @tixkit/workflows test:mysql-tier1
          PERFORMANCE_METRICS_PATH=artifacts/performance/load-harness-metrics.json bun run --cwd packages/workflows test:unit -- export-activity.test.ts
          bun run check:performance-budgets -- --config performance-budgets.integration.json

  integration-tests-mssql:
    name: Integration Tests (MSSQL)
    runs-on: tixkit-epyc-trusted
    env:
      DB_DRIVER: mssql
      DATABASE_URL_MSSQL: sqlserver://sa:Test-password-12345@tixkit-ci-mssql.arc-runners.svc.cluster.local:1433/tixkit?encrypt=false&trustServerCertificate=true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: ./.github/actions/setup-js
      - run: bun install --frozen-lockfile
      - name: Reset MSSQL database
        run: |
          cat > /tmp/reset-mssql.mjs <<'EOF'
          import { Connection, Request } from 'tedious';

          const operation = process.argv[2];

          if (operation !== 'setup' && operation !== 'cleanup') {
            console.error('Usage: reset-mssql.mjs setup|cleanup');
            process.exit(2);
          }

          const config = {
            server: 'tixkit-ci-mssql.arc-runners.svc.cluster.local',
            authentication: {
              type: 'default',
              options: {
                userName: 'sa',
                password: 'Test-password-12345',
              },
            },
            options: {
              port: 1433,
              database: 'master',
              encrypt: false,
              trustServerCertificate: true,
              connectTimeout: 5000,
              requestTimeout: 10000,
            },
          };

          function runSql(sql) {
            return new Promise((resolve, reject) => {
              const connection = new Connection(config);
              connection.on('connect', (error) => {
                if (error) {
                  connection.close();
                  reject(error);
                  return;
                }

                const request = new Request(
                  sql,
                  (requestError) => {
                    connection.close();
                    if (requestError) reject(requestError);
                    else resolve();
                  },
                );
                connection.execSql(request);
              });
              connection.connect();
            });
          }

          const resetSql = `
          IF DB_ID(N'tixkit') IS NOT NULL
          BEGIN
            ALTER DATABASE [tixkit] SET SINGLE_USER WITH ROLLBACK IMMEDIATE;
            DROP DATABASE [tixkit];
          END;
          CREATE DATABASE [tixkit];
          `;

          const cleanupSql = `
          IF DB_ID(N'tixkit') IS NOT NULL
          BEGIN
            ALTER DATABASE [tixkit] SET SINGLE_USER WITH ROLLBACK IMMEDIATE;
            DROP DATABASE [tixkit];
          END;
          `;

          let lastError;
          for (let attempt = 1; attempt <= 60; attempt += 1) {
            try {
              await runSql(operation === 'setup' ? resetSql : cleanupSql);
              console.log(operation === 'setup' ? 'MSSQL database reset' : 'MSSQL database cleaned up');
              process.exit(0);
            } catch (error) {
              lastError = error;
              console.log(`Waiting for MSSQL... (${attempt})`);
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }
          }

          console.error(lastError);
          process.exit(1);
          EOF
          bun /tmp/reset-mssql.mjs setup
      - run: bunx turbo run build --filter=@tixkit/domain --filter=@tixkit/db --filter=@tixkit/shared
      - run: bun run --filter @tixkit/db test:mssql
      - name: Cleanup MSSQL database
        if: ${{ always() }}
        run: bun /tmp/reset-mssql.mjs cleanup
