name: Trusted CI

on:
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

concurrency:
  group: trusted-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: tixkit-epyc-trusted
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Verify GitHub Action refs are pinned
        run: infra/ci/scripts/verify-github-action-pins.sh
      - uses: ./.github/actions/setup-js
      - run: bun install --frozen-lockfile
      - run: bun run audit
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck

  build:
    name: Build
    runs-on: tixkit-epyc-trusted
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: ./.github/actions/setup-js
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build
      - run: bun run check:performance-budgets

  public-repository:
    name: Public Repository Rehearsal
    runs-on: tixkit-epyc-trusted
    needs: lint-typecheck
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: ./.github/actions/setup-js
      - run: bun install --frozen-lockfile
      - name: Rehearse an independent public repository
        run: bun run validate:public-repository -- --repository .

  unit-tests:
    name: Unit Tests
    runs-on: tixkit-epyc-trusted
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: ./.github/actions/setup-js
      - run: bun install --frozen-lockfile
      - run: bun run test:unit

  flutter-sdk:
    name: Flutter SDK
    runs-on: tixkit-epyc-trusted
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Verify Flutter runner prerequisites
        run: |
          xz --version
          unzip -v | head -n 2
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.22.x'
          channel: stable
          cache: true
      - name: Install package dependencies
        run: cd packages/sdk-flutter && flutter pub get
      - name: Analyze package
        run: cd packages/sdk-flutter && flutter analyze
      - name: Run package tests
        run: cd packages/sdk-flutter && flutter test
      - name: Install example dependencies
        run: cd packages/sdk-flutter/example && flutter pub get
      - name: Build example app
        run: cd packages/sdk-flutter/example && flutter build web --release
      - name: Install demo dependencies
        run: cd apps/sdk-flutter-demo && flutter pub get
      - name: Analyze demo
        run: cd apps/sdk-flutter-demo && flutter analyze
      - name: Run demo tests
        run: cd apps/sdk-flutter-demo && flutter test
      - name: Build demo app
        run: cd apps/sdk-flutter-demo && flutter build web --release

  ios-sdk:
    name: iOS SDK
    runs-on: macos-latest
    if: ${{ vars.RUN_TRUSTED_IOS_SDK == '1' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Build Swift package
        run: cd packages/sdk-ios && swift build
      - name: Run Swift package tests
        run: cd packages/sdk-ios && swift test
      - name: Build example app
        run: cd packages/sdk-ios/Examples/TixkitIOSExample && swift build
      - name: Run example scanner smoke
        run: cd packages/sdk-ios/Examples/TixkitIOSExample && swift run TixkitIOSExample

  android-sdk:
    name: Android SDK
    runs-on: tixkit-epyc-trusted
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3 # v6
      - name: Build and test Android SDK
        run: cd packages/sdk-android && ./gradlew build test
      - name: Run example scanner smoke
        run: cd packages/sdk-android && ./gradlew :example:testDebugUnitTest

  react-native-demo:
    name: React Native Demo
    runs-on: tixkit-epyc-trusted
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: ./.github/actions/setup-js
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build RN SDK
        run: bunx turbo run build --filter @tixkit/react-native
      - name: Typecheck demo
        run: cd apps/sdk-react-native-demo && bun run typecheck
      - name: Lint demo
        run: cd apps/sdk-react-native-demo && bun run lint

  integration-tests-postgres:
    name: Integration Tests (PostgreSQL)
    runs-on: tixkit-epyc-trusted
    # The trusted label is backed by one physical EPYC host. Keep measured
    # database work behind the non-performance matrix so host contention does
    # not turn the committed latency budgets into scheduler-noise checks.
    needs:
      - build
      - public-repository
      - unit-tests
      - flutter-sdk
      - android-sdk
      - react-native-demo
    if: ${{ !cancelled() }}
    services:
      postgres:
        image: postgres:16-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
        env:
          POSTGRES_USER: tixkit
          POSTGRES_PASSWORD: tixkit
          POSTGRES_DB: tixkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tixkit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      temporal:
        image: temporalio/auto-setup:1.24@sha256:98cdb6b5e02d64cb933864a9ba91cb66065eb320623a0dafdf44beba535bca88
        ports:
          - 7233:7233
        env:
          DB: postgres12
          DB_PORT: 5432
          POSTGRES_SEEDS: postgres
          POSTGRES_USER: tixkit
          POSTGRES_PWD: tixkit
    env:
      DATABASE_URL: postgres://tixkit:tixkit@localhost:5432/tixkit
      DATABASE_URL_MIGRATION_TEST: postgres://tixkit:tixkit@localhost:5432/tixkit_migration_test
      REDIS_URL: redis://localhost:6379
      TEMPORAL_ADDRESS: localhost:7233
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: ./.github/actions/setup-js
      - run: bun install --frozen-lockfile
      - name: Provision isolated PostgreSQL migration-test database
        run: |
          docker exec "${{ job.services.postgres.id }}" sh -eu -c \
            "psql -U tixkit -tAc \"select 1 from pg_database where datname = 'tixkit_migration_test'\" | grep -q 1 || createdb -U tixkit tixkit_migration_test"
      - name: Wait for Temporal
        run: |
          for i in $(seq 1 60); do
            if timeout 2 bash -c '</dev/tcp/127.0.0.1/7233' 2>/dev/null; then
              echo "Temporal ready"
              exit 0
            fi
            echo "Waiting for Temporal... ($i)"; sleep 5
          done
          echo "Temporal did not become ready" >&2
          exit 1
      - run: bun run db:migrate
      - run: bunx turbo run build --filter=@tixkit/db --filter=@tixkit/shared
      - run: bun run test:integration

  integration-tests-mysql:
    name: Integration Tests (MySQL)
    runs-on: tixkit-epyc-trusted
    needs: integration-tests-postgres
    if: ${{ !cancelled() }}
    services:
      mysql:
        image: mysql:8.4@sha256:d36d39a64cd12a5c1cc9e6aa2bfb5f8d4c81a2f6586e0a04a9ae13939db02209
        command: --log-bin-trust-function-creators=1
        env:
          MYSQL_ROOT_PASSWORD: tixkit
          MYSQL_DATABASE: tixkit
          MYSQL_USER: tixkit
          MYSQL_PASSWORD: tixkit
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u tixkit -ptixkit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_MYSQL: mysql://tixkit:tixkit@localhost:3306/tixkit
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: ./.github/actions/setup-js
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate:mysql
      - run: bunx turbo run build --filter=@tixkit/db --filter=@tixkit/shared
      - name: MySQL Tier 1 correctness suites
        run: |
          DB_INTEGRATION_DRIVER=mysql bun --filter @tixkit/workflows test:mysql-tier1

  integration-tests-mssql:
    name: Integration Tests (MSSQL)
    runs-on: tixkit-epyc-trusted
    needs: provider-tests-stripe
    if: ${{ !cancelled() }}
    env:
      DB_DRIVER: mssql
      DATABASE_URL_MSSQL: ${{ secrets.TRUSTED_DATABASE_URL_MSSQL }}
      MSSQL_SA_PASSWORD: ${{ secrets.TRUSTED_MSSQL_SA_PASSWORD }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: ./.github/actions/setup-js
      - run: bun install --frozen-lockfile
      - name: Verify MSSQL trusted-runner secrets
        run: |
          test -n "$DATABASE_URL_MSSQL" || { echo "TRUSTED_DATABASE_URL_MSSQL is required" >&2; exit 1; }
          test -n "$MSSQL_SA_PASSWORD" || { echo "TRUSTED_MSSQL_SA_PASSWORD is required" >&2; exit 1; }
      - name: Reset MSSQL database
        run: |
          reset_script="$RUNNER_TEMP/reset-mssql.mjs"
          rm -f "$reset_script"
          cat > "$reset_script" <<'EOF'
          import { Connection, Request } from 'tedious';

          const operation = process.argv[2];

          if (operation !== 'setup' && operation !== 'cleanup') {
            console.error('Usage: reset-mssql.mjs setup|cleanup');
            process.exit(2);
          }

          const config = {
            server: 'tixkit-ci-mssql.arc-runners.svc.cluster.local',
            authentication: {
              type: 'default',
              options: {
                userName: 'sa',
                password: process.env.MSSQL_SA_PASSWORD,
              },
            },
            options: {
              port: 1433,
              database: 'master',
              encrypt: false,
              trustServerCertificate: true,
              connectTimeout: 5000,
              requestTimeout: 10000,
            },
          };

          function runSql(sql) {
            return new Promise((resolve, reject) => {
              const connection = new Connection(config);
              connection.on('connect', (error) => {
                if (error) {
                  connection.close();
                  reject(error);
                  return;
                }

                const request = new Request(
                  sql,
                  (requestError) => {
                    connection.close();
                    if (requestError) reject(requestError);
                    else resolve();
                  },
                );
                connection.execSql(request);
              });
              connection.connect();
            });
          }

          const resetSql = `
          IF DB_ID(N'tixkit') IS NOT NULL
          BEGIN
            ALTER DATABASE [tixkit] SET SINGLE_USER WITH ROLLBACK IMMEDIATE;
            DROP DATABASE [tixkit];
          END;
          CREATE DATABASE [tixkit];
          `;

          const cleanupSql = `
          IF DB_ID(N'tixkit') IS NOT NULL
          BEGIN
            ALTER DATABASE [tixkit] SET SINGLE_USER WITH ROLLBACK IMMEDIATE;
            DROP DATABASE [tixkit];
          END;
          `;

          let lastError;
          for (let attempt = 1; attempt <= 60; attempt += 1) {
            try {
              await runSql(operation === 'setup' ? resetSql : cleanupSql);
              console.log(operation === 'setup' ? 'MSSQL database reset' : 'MSSQL database cleaned up');
              process.exit(0);
            } catch (error) {
              lastError = error;
              console.log(`Waiting for MSSQL... (${attempt})`);
              await new Promise((resolve) => setTimeout(resolve, 5000));
            }
          }

          console.error(lastError);
          process.exit(1);
          EOF
          bun "$reset_script" setup
      - run: bunx turbo run build --filter=@tixkit/domain --filter=@tixkit/db --filter=@tixkit/shared
      - run: bun run --filter @tixkit/db test:mssql
      - name: Cleanup MSSQL database
        if: ${{ always() }}
        run: |
          reset_script="$RUNNER_TEMP/reset-mssql.mjs"
          cleanup_status=0
          if [ -f "$reset_script" ]; then
            bun "$reset_script" cleanup || cleanup_status=$?
          fi
          rm -f "$reset_script"
          exit "$cleanup_status"

  provider-tests-stripe:
    name: Provider Tests (Stripe)
    runs-on: tixkit-epyc-trusted
    needs:
      - build
      - unit-tests
      - integration-tests-postgres
      - browser-performance
    if: ${{ !cancelled() }}
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
        env:
          POSTGRES_USER: tixkit
          POSTGRES_PASSWORD: tixkit
          POSTGRES_DB: tixkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tixkit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      temporal:
        image: temporalio/auto-setup:1.24@sha256:98cdb6b5e02d64cb933864a9ba91cb66065eb320623a0dafdf44beba535bca88
        ports:
          - 7233:7233
        env:
          DB: postgres12
          DB_PORT: 5432
          POSTGRES_SEEDS: postgres
          POSTGRES_USER: tixkit
          POSTGRES_PWD: tixkit
    env:
      CI: 'true'
      ADMIN_DASHBOARD_URL: http://localhost:3202
      CHECKOUT_URL: http://localhost:3201
      TIXKIT_API_URL: http://localhost:4200
      TEMPORAL_TASK_QUEUE: tixkit-provider-trusted
      DATABASE_URL: postgres://tixkit:tixkit@localhost:5432/tixkit
      REDIS_URL: redis://localhost:6379
      TEMPORAL_ADDRESS: localhost:7233
      TEMPORAL_NAMESPACE: default
      QR_SIGNING_SECRET: ci-qr-signing-secret
      OFFLINE_MANIFEST_SIGNING_KEY: ci-offline-manifest-signing-key
      OFFLINE_MANIFEST_KEY_ID: manifest:ci
      CLERK_SECRET_KEY: ''
      CLERK_PUBLISHABLE_KEY: ''
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ''
      CLERK_WEBHOOK_SECRET: ''
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      STRIPE_CONNECT_CLIENT_ID: ${{ secrets.STRIPE_CONNECT_CLIENT_ID }}
      OTEL_SDK_DISABLED: 'true'
      RATE_LIMIT_MAX: '100000'
      RATE_LIMIT_TIME_WINDOW: 1 minute
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: ./.github/actions/setup-js
      - name: Require trusted Stripe test-mode secrets
        run: |
          missing=()
          for name in STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY STRIPE_CONNECT_CLIENT_ID; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required trusted-runner secrets: ${missing[*]}" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          {
            echo "### Stripe provider secret gate"
            echo
            echo "All required test-mode secret names are configured; values are redacted."
          } >> "$GITHUB_STEP_SUMMARY"
      - run: bun install --frozen-lockfile
      - name: Install pinned Playwright browser and system dependencies
        run: bash infra/ci/scripts/install-playwright-runtime.sh
      - name: Start MinIO
        run: |
          docker rm -f tixkit-provider-minio >/dev/null 2>&1 || true
          docker run --detach --name tixkit-provider-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin \
            --health-cmd 'curl -f http://localhost:9000/minio/health/live' \
            --health-interval 5s \
            --health-timeout 3s \
            --health-retries 12 \
            minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data
          for attempt in {1..30}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' tixkit-provider-minio 2>/dev/null || true)"
            if [ "$status" = healthy ]; then exit 0; fi
            if [ "$status" = unhealthy ]; then docker logs tixkit-provider-minio; exit 1; fi
            sleep 2
          done
          docker logs tixkit-provider-minio
          exit 1
      - name: Write provider CI env file
        run: |
          umask 077
          cat > .env.local <<EOF
          NODE_ENV=development
          PORT=4000
          LOG_LEVEL=info
          OTEL_SDK_DISABLED=true
          API_BASE_URL=http://localhost:4000
          NEXT_PUBLIC_TIXKIT_API_BASE_URL=http://localhost:4000/v1
          NEXT_PUBLIC_ADMIN_API_BASE_URL=http://localhost:4000
          DATABASE_URL=postgres://tixkit:tixkit@localhost:5432/tixkit
          REDIS_URL=redis://localhost:6379
          QR_SIGNING_SECRET=ci-qr-signing-secret
          OFFLINE_MANIFEST_SIGNING_KEY=ci-offline-manifest-signing-key
          OFFLINE_MANIFEST_KEY_ID=manifest:ci
          TEMPORAL_ADDRESS=localhost:7233
          TEMPORAL_NAMESPACE=default
          TEMPORAL_TASK_QUEUE=tixkit-provider-trusted
          CLERK_SECRET_KEY=
          CLERK_PUBLISHABLE_KEY=
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=
          CLERK_WEBHOOK_SECRET=
          STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
          STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
          STRIPE_CONNECT_CLIENT_ID=${STRIPE_CONNECT_CLIENT_ID}
          EOF
      - name: Wait for Temporal
        run: |
          for attempt in {1..90}; do
            if bash -c "echo > /dev/tcp/localhost/7233" 2>/dev/null; then sleep 3; exit 0; fi
            sleep 2
          done
          exit 1
      - run: bun run --env-file=.env.local db:migrate
      - run: bunx turbo run build --filter=@tixkit/db --filter=@tixkit/shared --filter=@tixkit/workflows --filter=@tixkit/openapi
      - name: Run direct Stripe provider workflow test
        run: RUN_STRIPE_PROVIDER_TESTS=1 bun run --env-file=.env.local --filter @tixkit/workflows test:provider:stripe
      - name: Run hosted Stripe Elements browser test
        run: bun run --env-file=.env.local test:e2e:stripe-provider
      - name: Run Stripe Connect provider test
        run: cd packages/api && RUN_STRIPE_CONNECT_TESTS=1 bun --env-file=../../.env.local vitest run src/__tests__/integration/stripe-connect-provider.integration.test.ts
      - name: Record provider success
        run: |
          {
            echo "### Stripe provider tests passed"
            echo
            echo "Provider Tests (Stripe) did not skip."
            echo "- Direct Stripe create/confirm/refund validation passed."
            echo "- Hosted Stripe Elements checkout/refund validation passed."
            echo "- Stripe Connect account/status validation passed."
            echo "- Secret values were redacted."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload provider browser artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trusted-stripe-provider-browser-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Show MinIO logs on failure
        if: failure()
        run: docker logs tixkit-provider-minio 2>/dev/null || true
      - name: Remove provider credential file
        if: always()
        run: rm -f .env.local
      - name: Stop MinIO
        if: always()
        run: docker rm -f tixkit-provider-minio >/dev/null 2>&1 || true

  browser-performance:
    name: Browser & Lighthouse Performance
    runs-on: tixkit-epyc-trusted
    needs:
      - build
      - unit-tests
      - integration-tests-postgres
      - integration-tests-mysql
    if: ${{ !cancelled() }}
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
        env:
          POSTGRES_USER: tixkit
          POSTGRES_PASSWORD: tixkit
          POSTGRES_DB: tixkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tixkit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      temporal:
        image: temporalio/auto-setup:1.24@sha256:98cdb6b5e02d64cb933864a9ba91cb66065eb320623a0dafdf44beba535bca88
        ports:
          - 7233:7233
        env:
          DB: postgres12
          DB_PORT: 5432
          POSTGRES_SEEDS: postgres
          POSTGRES_USER: tixkit
          POSTGRES_PWD: tixkit
    env:
      CI: 'true'
      RUN_LIGHTHOUSE_BUDGETS: '1'
      ADMIN_DASHBOARD_URL: http://localhost:3202
      CHECKOUT_URL: http://localhost:3201
      TIXKIT_API_URL: http://localhost:4200
      TEMPORAL_TASK_QUEUE: tixkit-performance-trusted
      DATABASE_URL: postgres://tixkit:tixkit@localhost:5432/tixkit
      REDIS_URL: redis://localhost:6379
      TEMPORAL_ADDRESS: localhost:7233
      TEMPORAL_NAMESPACE: default
      S3_ENDPOINT: http://localhost:9000
      S3_BUCKET: tixkit
      S3_ACCESS_KEY_ID: minioadmin
      S3_SECRET_ACCESS_KEY: minioadmin
      S3_REGION: us-east-1
      QR_SIGNING_SECRET: ci-qr-signing-secret
      OFFLINE_MANIFEST_SIGNING_KEY: ci-offline-manifest-signing-key
      OFFLINE_MANIFEST_KEY_ID: manifest:ci
      CLERK_SECRET_KEY: ''
      CLERK_PUBLISHABLE_KEY: ''
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ''
      CLERK_WEBHOOK_SECRET: ''
      STRIPE_SECRET_KEY: ''
      STRIPE_WEBHOOK_SECRET: ''
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ''
      OTEL_SDK_DISABLED: 'true'
      RATE_LIMIT_MAX: '100000'
      RATE_LIMIT_TIME_WINDOW: 1 minute
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: ./.github/actions/setup-js
      - run: bun install --frozen-lockfile
      - name: Install pinned Playwright browser and system dependencies
        run: bash infra/ci/scripts/install-playwright-runtime.sh
      - name: Start MinIO
        run: |
          docker rm -f tixkit-performance-minio >/dev/null 2>&1 || true
          docker run --detach --name tixkit-performance-minio \
            --publish 9000:9000 \
            --env MINIO_ROOT_USER=minioadmin \
            --env MINIO_ROOT_PASSWORD=minioadmin \
            --health-cmd 'curl -f http://localhost:9000/minio/health/live' \
            --health-interval 5s \
            --health-timeout 3s \
            --health-retries 12 \
            minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data
          for attempt in {1..30}; do
            status="$(docker inspect --format '{{.State.Health.Status}}' tixkit-performance-minio 2>/dev/null || true)"
            if [ "$status" = healthy ]; then exit 0; fi
            if [ "$status" = unhealthy ]; then docker logs tixkit-performance-minio; exit 1; fi
            sleep 2
          done
          docker logs tixkit-performance-minio
          exit 1
      - name: Wait for Temporal
        run: |
          for attempt in {1..90}; do
            if bash -c "echo > /dev/tcp/localhost/7233" 2>/dev/null; then sleep 3; exit 0; fi
            sleep 2
          done
          exit 1
      - run: bun run db:migrate
      - name: Build browser dependencies
        run: |
          bun run --filter @tixkit/widget build
          bunx turbo run build
      - name: Run widget embed golden-path smoke
        run: bun run test:e2e:checkout-widget -- --project=chromium
      - name: Generate and enforce Lighthouse budgets
        run: bunx playwright test e2e/performance-lighthouse.spec.ts --project=chromium
      - name: Upload browser performance artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: trusted-browser-performance
          path: |
            artifacts/performance/lighthouse/
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 30
      - name: Show MinIO logs on failure
        if: failure()
        run: docker logs tixkit-performance-minio 2>/dev/null || true
      - name: Stop MinIO
        if: always()
        run: docker rm -f tixkit-performance-minio >/dev/null 2>&1 || true
