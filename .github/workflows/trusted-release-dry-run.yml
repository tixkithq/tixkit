name: Trusted Release Dry Run

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: trusted-release-dry-run-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-dry-run:
    name: Build, Migrate, Render, Smoke
    runs-on: tixkit-epyc-trusted
    services:
      postgres:
        image: postgres:16-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
        env:
          POSTGRES_USER: tixkit
          POSTGRES_PASSWORD: tixkit
          POSTGRES_DB: tixkit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tixkit"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mysql:
        image: mysql:8.4@sha256:d36d39a64cd12a5c1cc9e6aa2bfb5f8d4c81a2f6586e0a04a9ae13939db02209
        command: --log-bin-trust-function-creators=1
        env:
          MYSQL_ROOT_PASSWORD: tixkit
          MYSQL_DATABASE: tixkit
          MYSQL_USER: tixkit
          MYSQL_PASSWORD: tixkit
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u tixkit -ptixkit"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://tixkit:tixkit@localhost:5432/tixkit
      DATABASE_URL_MYSQL: mysql://tixkit:tixkit@localhost:3306/tixkit
      REDIS_URL: redis://localhost:6379
      TEMPORAL_ADDRESS: localhost:7233
      TEMPORAL_NAMESPACE: default
      QR_SIGNING_SECRET: ci-qr-signing-secret
      OFFLINE_MANIFEST_SIGNING_KEY: ci-offline-manifest-signing-key
      OFFLINE_MANIFEST_KEY_ID: manifest:ci
      OTEL_SDK_DISABLED: 'true'
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Verify GitHub Action refs are pinned
        run: infra/ci/scripts/verify-github-action-pins.sh
      - uses: ./.github/actions/setup-js
      - uses: azure/setup-helm@59b1c81c6280f5abebb1fb1bc585696daa7dfb42 # v5
      - run: bun install --frozen-lockfile
      - name: Validate documentation contracts and generated reference
        run: bun run docs:check
      - name: Build static documentation release
        run: bun run --filter @tixkit/docs build:static
      - name: Validate sanitized OSS documentation release
        run: bun run export:oss -- --out /tmp/tixkit-release-oss-export
      - name: Write release dry-run env file
        run: |
          cat > .env.local <<'EOF'
          NODE_ENV=development
          DATABASE_URL=postgres://tixkit:tixkit@localhost:5432/tixkit
          DATABASE_URL_MYSQL=mysql://tixkit:tixkit@localhost:3306/tixkit
          REDIS_URL=redis://localhost:6379
          TEMPORAL_ADDRESS=localhost:7233
          TEMPORAL_NAMESPACE=default
          QR_SIGNING_SECRET=ci-qr-signing-secret
          OFFLINE_MANIFEST_SIGNING_KEY=ci-offline-manifest-signing-key
          OFFLINE_MANIFEST_KEY_ID=manifest:ci
          OTEL_SDK_DISABLED=true
          EOF
      - run: bun run build
      - run: bun run --env-file=.env.local db:migrate
      - run: bun run --env-file=.env.local db:migrate:mysql
      - run: bun run deploy:check
      - run: bun run iac:lint
      - run: bun run iac:template >/tmp/tixkit-rendered.yaml
      - name: Smoke rendered manifest
        run: |
          test -s /tmp/tixkit-rendered.yaml
          grep -q 'kind: Deployment' /tmp/tixkit-rendered.yaml
          grep -q 'tixkit-api' /tmp/tixkit-rendered.yaml
          grep -q 'tixkit-worker' /tmp/tixkit-rendered.yaml
          grep -q 'tixkit-checkout' /tmp/tixkit-rendered.yaml
          grep -q 'tixkit-admin' /tmp/tixkit-rendered.yaml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tixkit-rendered-release-manifest
          path: /tmp/tixkit-rendered.yaml
          if-no-files-found: error
