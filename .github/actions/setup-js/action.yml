name: Setup JavaScript Toolchain
description: Set up Bun, Node, and optional CI caches for Tixkit JavaScript jobs.

inputs:
  turbo-cache:
    description: Restore and save the local Turbo cache.
    required: false
    default: 'true'
  playwright-cache:
    description: Restore and save Playwright browser downloads.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14

    - uses: actions/setup-node@v6
      with:
        node-version: 24

    - name: Cache Bun package downloads
      uses: actions/cache@v6
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-

    - name: Cache Turbo build artifacts
      if: inputs.turbo-cache == 'true'
      uses: actions/cache@v6
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ hashFiles('bun.lock', 'turbo.json') }}-${{ hashFiles('package.json', 'tsconfig.base.json', 'apps/*/package.json', 'packages/*/package.json', 'apps/*/tsconfig.json', 'packages/*/tsconfig.json', 'apps/**/src/**', 'packages/**/src/**') }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ hashFiles('bun.lock', 'turbo.json') }}-
          turbo-${{ runner.os }}-

    - name: Resolve Playwright version
      if: inputs.playwright-cache == 'true'
      id: playwright-version
      shell: bash
      run: |
        version="$(node -p "require('./package.json').devDependencies['@playwright/test']")"
        echo "version=${version}" >> "$GITHUB_OUTPUT"

    - name: Cache Playwright browsers
      if: inputs.playwright-cache == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-
          playwright-${{ runner.os }}-
