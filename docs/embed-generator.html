<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tixkit embed generator</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }
      body {
        margin: 0;
        background: Canvas;
        color: CanvasText;
      }
      main {
        width: min(56rem, calc(100% - 2rem));
        margin: 2rem auto;
      }
      form,
      section {
        display: grid;
        gap: 1rem;
        padding: 1.25rem;
        border: 1px solid color-mix(in srgb, CanvasText 22%, Canvas);
        border-radius: 0.75rem;
      }
      section {
        margin-top: 1rem;
      }
      .fields {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr));
        gap: 1rem;
      }
      label {
        display: grid;
        gap: 0.35rem;
        font-weight: 600;
      }
      label.checkbox {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      input,
      select,
      textarea,
      button {
        box-sizing: border-box;
        width: 100%;
        min-height: 2.5rem;
        padding: 0.55rem 0.7rem;
        border: 1px solid color-mix(in srgb, CanvasText 30%, Canvas);
        border-radius: 0.4rem;
        background: Canvas;
        color: CanvasText;
        font: inherit;
      }
      input[type='checkbox'] {
        width: 1rem;
        min-height: 1rem;
      }
      textarea {
        min-height: 16rem;
        resize: vertical;
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      }
      pre {
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }
      #error {
        min-height: 1.5rem;
        color: #b42318;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tixkit embed generator</h1>
      <p>Generate a validated Embed Contract 1.0 snippet and its least-privilege CSP profile.</p>

      <form id="generator">
        <div class="fields">
          <label>
            Brand ID
            <input id="brandId" name="brandId" value="brd_demo" required />
          </label>
          <label>
            Event ID
            <input id="eventId" name="eventId" value="evt_demo" required />
          </label>
          <label>
            Mode
            <select id="mode" name="mode">
              <option value="inline">Inline</option>
              <option value="modal">Modal</option>
              <option value="button">Button</option>
              <option value="redirect">Redirect</option>
            </select>
          </label>
          <label>
            Platform
            <select id="platform" name="platform">
              <option value="html">HTML</option>
              <option value="react">React</option>
              <option value="vue">Vue</option>
              <option value="svelte">Svelte</option>
              <option value="webflow">Webflow</option>
              <option value="framer">Framer</option>
            </select>
          </label>
          <label>
            Host origin
            <input id="hostOrigin" name="hostOrigin" type="url" value="http://localhost:3000" />
          </label>
          <label>
            Checkout base URL
            <input
              id="checkoutBaseUrl"
              name="checkoutBaseUrl"
              type="url"
              value="https://checkout.tixkit.com"
            />
          </label>
          <label>
            Widget script URL
            <input
              id="widgetScriptUrl"
              name="widgetScriptUrl"
              type="url"
              value="http://localhost:3000/tixkit-widget.js"
            />
          </label>
        </div>
        <label class="checkbox">
          <input id="lifecycle" name="lifecycle" type="checkbox" />
          Include lifecycle event wiring
        </label>
        <p id="error" role="alert" aria-live="polite"></p>
      </form>

      <section aria-labelledby="snippet-heading">
        <h2 id="snippet-heading">Embed snippet</h2>
        <textarea id="snippet" readonly aria-label="Embed snippet"></textarea>
        <button id="copyButton" type="button">Copy snippet</button>
      </section>

      <section aria-labelledby="csp-heading">
        <h2 id="csp-heading">Content Security Policy</h2>
        <pre id="csp"></pre>
      </section>
    </main>

    <script type="module">
      import { generateEmbed } from '../packages/embed-core/dist/index.js';

      const form = document.querySelector('#generator');
      const snippet = document.querySelector('#snippet');
      const csp = document.querySelector('#csp');
      const error = document.querySelector('#error');
      const copyButton = document.querySelector('#copyButton');
      const eventId = document.querySelector('#eventId');

      function render() {
        const data = new FormData(form);
        const result = generateEmbed({
          brandId: String(data.get('brandId') ?? ''),
          eventId: String(data.get('eventId') ?? ''),
          mode: String(data.get('mode') ?? 'inline'),
          platform: String(data.get('platform') ?? 'html'),
          hostOrigin: String(data.get('hostOrigin') ?? '') || undefined,
          checkoutBaseUrl: String(data.get('checkoutBaseUrl') ?? '') || undefined,
          widgetScriptUrl: String(data.get('widgetScriptUrl') ?? '') || undefined,
          includeLifecycle: data.get('lifecycle') === 'on',
        });

        if (!result.ok) {
          snippet.value = '';
          csp.textContent = '';
          error.textContent = result.errors
            .map((issue) => `${issue.path}: ${issue.message}`)
            .join(' ');
          eventId.setAttribute(
            'aria-invalid',
            String(result.errors.some((issue) => issue.path === 'eventId')),
          );
          copyButton.disabled = true;
          return;
        }

        snippet.value = result.snippet;
        csp.textContent = result.csp.header;
        error.textContent = '';
        eventId.setAttribute('aria-invalid', 'false');
        copyButton.disabled = false;
      }

      form.addEventListener('input', render);
      form.addEventListener('change', render);
      copyButton.addEventListener('click', async () => {
        await navigator.clipboard.writeText(snippet.value);
      });
      render();
    </script>
  </body>
</html>
